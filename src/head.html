<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验室管理台 · 小鼠 / 试剂 / 耗材</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --accent:#0d9488; --accent-d:#0f766e; --warn:#b45309; --danger:#dc2626; --ok:#15803d;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}

/* ---------- 侧栏 ---------- */
.side{background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px 12px;font-size:15px;font-weight:600;color:#fff;letter-spacing:.5px}
.brand small{display:block;font-weight:400;font-size:11px;color:#64748b;margin-top:2px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:2px;padding:8px}
nav button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;color:#cbd5e1;cursor:pointer;font-size:13.5px}
nav button:hover{background:#1e293b;color:#fff}
nav button.active{background:var(--accent);color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:12px 16px;font-size:11px;color:#64748b;border-top:1px solid #1e293b;word-break:break-all}

/* ---------- 主区 ---------- */
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h1{font-size:17px;margin:0;font-weight:600}
.topbar h1 span{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.topActions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#content{padding:18px 22px 60px}

.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:#cbd5e1;background:#fafafa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-d)}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.mini{padding:3px 8px;font-size:12px;box-shadow:none}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;color:var(--muted);padding:3px 6px}
.btn.ghost:hover{background:#f1f5f9;color:var(--ink)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.search:focus,select:focus,input:focus,textarea:focus{outline:2px solid #99f6e4;outline-offset:0;border-color:var(--accent)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat{padding:13px 15px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;line-height:1.25;margin-top:2px}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--danger)} .stat.ok .v{color:var(--ok)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.panel h3{margin:0;padding:11px 15px;font-size:13.5px;border-bottom:1px solid var(--line);background:#fafbfc;font-weight:600}
.panel h3 em{font-style:normal;color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.panel .body{padding:12px 15px}

.tablewrap{overflow:auto;max-height:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#fafbfc;font-weight:600;color:#475569;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{background:#fafbfc;font-weight:600;border-top:2px solid var(--line)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);background:#f8fafc;white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
.tag.warn{color:var(--warn);border-color:#fde68a;background:#fffbeb}
.tag.bad{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.tag.info{color:var(--accent-d);border-color:#99f6e4;background:#f0fdfa}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.wrap-cell{max-width:280px;white-space:pre-wrap;word-break:break-word}

/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.hidden{display:none}
.dialog{background:#fff;border-radius:12px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(2,6,23,.3)}
.dhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;font-size:15px}
.dhead .x{margin-left:auto;background:none;border:0;font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
.dhead .x:hover{background:#f1f5f9}
.dbody{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;overflow:auto}
.dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dfoot .hint{margin-right:auto;font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;color:#334155;font-weight:600}
.field>span b{color:var(--danger);font-weight:400}
.field em{font-style:normal;font-size:11px;color:var(--muted)}
.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.field textarea{resize:vertical}
.field.wide{grid-column:1 / -1}
.dfoot .total{font-weight:700;color:var(--accent-d)}

/* ---------- 提示条 ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#b91c1c}

.items{display:flex;flex-direction:column;gap:6px}
.items .row{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.items .row b{font-weight:600}
.items .row .r{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.hintbox{font-size:12.5px;color:var(--muted);line-height:1.7}
.hintbox code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ---------- 打印 ---------- */
#printArea{display:none}
@media print{
  body{background:#fff}
  .app,#toast,.overlay{display:none!important}
  #printArea{display:block!important}
  .cage-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
  .cage{border:1px dashed #333;padding:6mm 5mm;break-inside:avoid}
  .cage .t{font-size:15pt;font-weight:700}
  .cage .g{font-size:10pt;margin-top:3mm;line-height:1.6}
  .cage .p{font-size:9.5pt;margin-top:3mm;border-top:1px dotted #999;padding-top:2mm}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow:auto}
  .side-foot{display:none}
  nav{flex-direction:row;flex-wrap:wrap}
  .dbody{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
/* ---------- v2 追加：排序表头 / 欢迎卡 / 设置行 / 笼牌版式 ---------- */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent-d);background:#f1f5f9}
th.sortable.on{color:var(--accent-d);background:#f0fdfa}
.welcome .body h2{margin:2px 0 6px;font-size:16px}
.welcome .body p{margin:0 0 12px}
.setting{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.setting>span{min-width:130px;color:#334155;font-weight:600;font-size:12.5px}
.setting input{width:104px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.setting em{font-style:normal;font-size:11.5px;color:var(--muted)}
.print-h{font-family:"Microsoft YaHei","Segoe UI",sans-serif;margin:0 0 6mm}
.dfoot .total{font-weight:700;color:var(--accent-d)}

@page{size:A4;margin:12mm}
@media print{
  .cage-grid{display:grid;gap:6mm}
  .cage-grid.l4{grid-template-columns:repeat(2,1fr)}
  .cage-grid.l6{grid-template-columns:repeat(2,1fr)}
  .cage-grid.l9{grid-template-columns:repeat(3,1fr)}
  .cage-grid.l4 .cage{padding:8mm 6mm}
  .cage-grid.l4 .cage .t{font-size:17pt}
  .cage-grid.l4 .cage .g{font-size:11pt}
  .cage-grid.l4 .cage .p{font-size:10pt}
  .cage-grid.l6 .cage .t{font-size:14pt}
  .cage-grid.l6 .cage .g{font-size:9.5pt}
  .cage-grid.l6 .cage .p{font-size:8.5pt}
  .cage-grid.l9 .cage{padding:4mm 3.5mm}
  .cage-grid.l9 .cage .t{font-size:11.5pt}
  .cage-grid.l9 .cage .g{font-size:8pt;margin-top:2mm;line-height:1.45}
  .cage-grid.l9 .cage .p{font-size:7.5pt;margin-top:2mm;padding-top:1.5mm}
  /* 打印永远是黑纸白字，不受深色主题影响 */
  html,body,#printArea,.cage{color:#000!important;background:#fff!important}
  .cage{border-color:#333!important}
}

/* ---------- v2.1 追加：小图表 / 演示条 / 深色主题 ---------- */
.hbars{display:flex;flex-direction:column;gap:7px}
.hrow{display:grid;grid-template-columns:104px 1fr 52px;gap:8px;align-items:center;font-size:12.5px}
.hrow .hl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hb{background:var(--line);border-radius:99px;height:10px;overflow:hidden}
.hrow .hb i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hrow .hv{text-align:right;font-variant-numeric:tabular-nums}
.trend{display:flex;align-items:flex-end;gap:2px;height:104px;border-bottom:1px solid var(--line)}
.trend .bar{flex:1;display:flex;flex-direction:column-reverse;min-height:0;border-radius:2px 2px 0 0;overflow:hidden}
.trend .bar i{display:block;width:100%}
.trend .i-in{background:var(--ok);opacity:.72}
.trend .i-out{background:var(--accent)}
.trend-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.lg{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 6px;vertical-align:middle}
.lg-in{background:var(--ok)} .lg-out{background:var(--accent)}
.demo-bar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;line-height:1.6}
.demo-bar a{color:#92400e;font-weight:600}

/* 深色主题：只覆盖颜色变量 + 少数写死颜色的容器 */
[data-theme="dark"]{
  --bg:#0b1220;--card:#111a2b;--ink:#e2e8f0;--muted:#93a4bd;--line:#22304a;
  --accent:#14b8a6;--accent-d:#2dd4bf;--warn:#fbbf24;--danger:#f87171;--ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
[data-theme="dark"] .topbar,[data-theme="dark"] .btn,[data-theme="dark"] .search,[data-theme="dark"] select,
[data-theme="dark"] .dialog,[data-theme="dark"] .items .row,[data-theme="dark"] .field input,
[data-theme="dark"] .field select,[data-theme="dark"] .field textarea{background:var(--card);color:var(--ink)}
[data-theme="dark"] .panel h3,[data-theme="dark"] th,[data-theme="dark"] tfoot td{background:#16223a;color:#c7d3e6}
[data-theme="dark"] tbody tr:hover{background:#16223a}
[data-theme="dark"] th.sortable:hover,[data-theme="dark"] th.sortable.on{background:#16223a}
[data-theme="dark"] .btn:hover{background:#1b2a44}
[data-theme="dark"] .btn.ghost:hover,[data-theme="dark"] .dhead .x:hover{background:#1b2a44;color:var(--ink)}
[data-theme="dark"] .field>span,[data-theme="dark"] .setting>span{color:#a9b8cf}
[data-theme="dark"] .tag{background:#16223a;border-color:#26364f;color:#c7d3e6}
[data-theme="dark"] .tag.ok{background:#0a2e1c;border-color:#166534;color:#6ee7a8}
[data-theme="dark"] .tag.warn{background:#33260a;border-color:#a16207;color:#fcd34d}
[data-theme="dark"] .tag.bad{background:#3a1414;border-color:#b91c1c;color:#fca5a5}
[data-theme="dark"] .tag.info{background:#0a2b2a;border-color:#0f766e;color:#5eead4}
[data-theme="dark"] .hintbox code{background:#16223a}
[data-theme="dark"] .side{background:#070d18}
[data-theme="dark"] .demo-bar{background:#33260a;border-color:#a16207;color:#fcd34d}
[data-theme="dark"] .demo-bar a{color:#fcd34d}
</style>
</head>
