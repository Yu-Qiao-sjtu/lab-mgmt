<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验室管理台 · 小鼠 / 试剂 / 耗材</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --accent:#0d9488; --accent-d:#0f766e; --warn:#b45309; --danger:#dc2626; --ok:#15803d;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}

/* ---------- 侧栏 ---------- */
.side{background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px 12px;font-size:15px;font-weight:600;color:#fff;letter-spacing:.5px}
.brand small{display:block;font-weight:400;font-size:11px;color:#64748b;margin-top:2px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:2px;padding:8px}
nav button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;color:#cbd5e1;cursor:pointer;font-size:13.5px}
nav button:hover{background:#1e293b;color:#fff}
nav button.active{background:var(--accent);color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:12px 16px;font-size:11px;color:#64748b;border-top:1px solid #1e293b;word-break:break-all}

/* ---------- 主区 ---------- */
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h1{font-size:17px;margin:0;font-weight:600}
.topbar h1 span{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.topActions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#content{padding:18px 22px 60px}

.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:#cbd5e1;background:#fafafa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-d)}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.mini{padding:3px 8px;font-size:12px;box-shadow:none}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;color:var(--muted);padding:3px 6px}
.btn.ghost:hover{background:#f1f5f9;color:var(--ink)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.search:focus,select:focus,input:focus,textarea:focus{outline:2px solid #99f6e4;outline-offset:0;border-color:var(--accent)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat{padding:13px 15px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;line-height:1.25;margin-top:2px}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--danger)} .stat.ok .v{color:var(--ok)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.panel h3{margin:0;padding:11px 15px;font-size:13.5px;border-bottom:1px solid var(--line);background:#fafbfc;font-weight:600}
.panel h3 em{font-style:normal;color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.panel .body{padding:12px 15px}

.tablewrap{overflow:auto;max-height:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#fafbfc;font-weight:600;color:#475569;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{background:#fafbfc;font-weight:600;border-top:2px solid var(--line)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);background:#f8fafc;white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
.tag.warn{color:var(--warn);border-color:#fde68a;background:#fffbeb}
.tag.bad{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.tag.info{color:var(--accent-d);border-color:#99f6e4;background:#f0fdfa}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.wrap-cell{max-width:280px;white-space:pre-wrap;word-break:break-word}

/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.hidden{display:none}
.dialog{background:#fff;border-radius:12px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(2,6,23,.3)}
.dhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;font-size:15px}
.dhead .x{margin-left:auto;background:none;border:0;font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
.dhead .x:hover{background:#f1f5f9}
.dbody{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;overflow:auto}
.dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dfoot .hint{margin-right:auto;font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;color:#334155;font-weight:600}
.field>span b{color:var(--danger);font-weight:400}
.field em{font-style:normal;font-size:11px;color:var(--muted)}
.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.field textarea{resize:vertical}
.field.wide{grid-column:1 / -1}
.dfoot .total{font-weight:700;color:var(--accent-d)}

/* ---------- 提示条 ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#b91c1c}

.items{display:flex;flex-direction:column;gap:6px}
.items .row{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.items .row b{font-weight:600}
.items .row .r{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.hintbox{font-size:12.5px;color:var(--muted);line-height:1.7}
.hintbox code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ---------- 打印 ---------- */
#printArea{display:none}
@media print{
  body{background:#fff}
  .app,#toast,.overlay{display:none!important}
  #printArea{display:block!important}
  .cage-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
  .cage{border:1px dashed #333;padding:6mm 5mm;break-inside:avoid}
  .cage .t{font-size:15pt;font-weight:700}
  .cage .g{font-size:10pt;margin-top:3mm;line-height:1.6}
  .cage .p{font-size:9.5pt;margin-top:3mm;border-top:1px dotted #999;padding-top:2mm}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow:auto}
  .side-foot{display:none}
  nav{flex-direction:row;flex-wrap:wrap}
  .dbody{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
/* ---------- v2 追加：排序表头 / 欢迎卡 / 设置行 / 笼牌版式 ---------- */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent-d);background:#f1f5f9}
th.sortable.on{color:var(--accent-d);background:#f0fdfa}
.welcome .body h2{margin:2px 0 6px;font-size:16px}
.welcome .body p{margin:0 0 12px}
.setting{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.setting>span{min-width:130px;color:#334155;font-weight:600;font-size:12.5px}
.setting input{width:104px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.setting em{font-style:normal;font-size:11.5px;color:var(--muted)}
.print-h{font-family:"Microsoft YaHei","Segoe UI",sans-serif;margin:0 0 6mm}
.dfoot .total{font-weight:700;color:var(--accent-d)}

@page{size:A4;margin:12mm}
@media print{
  .cage-grid{display:grid;gap:6mm}
  .cage-grid.l4{grid-template-columns:repeat(2,1fr)}
  .cage-grid.l6{grid-template-columns:repeat(2,1fr)}
  .cage-grid.l9{grid-template-columns:repeat(3,1fr)}
  .cage-grid.l4 .cage{padding:8mm 6mm}
  .cage-grid.l4 .cage .t{font-size:17pt}
  .cage-grid.l4 .cage .g{font-size:11pt}
  .cage-grid.l4 .cage .p{font-size:10pt}
  .cage-grid.l6 .cage .t{font-size:14pt}
  .cage-grid.l6 .cage .g{font-size:9.5pt}
  .cage-grid.l6 .cage .p{font-size:8.5pt}
  .cage-grid.l9 .cage{padding:4mm 3.5mm}
  .cage-grid.l9 .cage .t{font-size:11.5pt}
  .cage-grid.l9 .cage .g{font-size:8pt;margin-top:2mm;line-height:1.45}
  .cage-grid.l9 .cage .p{font-size:7.5pt;margin-top:2mm;padding-top:1.5mm}
  /* 打印永远是黑纸白字，不受深色主题影响 */
  html,body,#printArea,.cage{color:#000!important;background:#fff!important}
  .cage{border-color:#333!important}
}

/* ---------- v2.1 追加：小图表 / 演示条 / 深色主题 ---------- */
.hbars{display:flex;flex-direction:column;gap:7px}
.hrow{display:grid;grid-template-columns:104px 1fr 52px;gap:8px;align-items:center;font-size:12.5px}
.hrow .hl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hb{background:var(--line);border-radius:99px;height:10px;overflow:hidden}
.hrow .hb i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hrow .hv{text-align:right;font-variant-numeric:tabular-nums}
.trend{display:flex;align-items:flex-end;gap:2px;height:104px;border-bottom:1px solid var(--line)}
.trend .bar{flex:1;display:flex;flex-direction:column-reverse;min-height:0;border-radius:2px 2px 0 0;overflow:hidden}
.trend .bar i{display:block;width:100%}
.trend .i-in{background:var(--ok);opacity:.72}
.trend .i-out{background:var(--accent)}
.trend-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.lg{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 6px;vertical-align:middle}
.lg-in{background:var(--ok)} .lg-out{background:var(--accent)}
.demo-bar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:12.5px;line-height:1.6}
.demo-bar a{color:#92400e;font-weight:600}

/* 深色主题：只覆盖颜色变量 + 少数写死颜色的容器 */
[data-theme="dark"]{
  --bg:#0b1220;--card:#111a2b;--ink:#e2e8f0;--muted:#93a4bd;--line:#22304a;
  --accent:#14b8a6;--accent-d:#2dd4bf;--warn:#fbbf24;--danger:#f87171;--ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
[data-theme="dark"] .topbar,[data-theme="dark"] .btn,[data-theme="dark"] .search,[data-theme="dark"] select,
[data-theme="dark"] .dialog,[data-theme="dark"] .items .row,[data-theme="dark"] .field input,
[data-theme="dark"] .field select,[data-theme="dark"] .field textarea{background:var(--card);color:var(--ink)}
[data-theme="dark"] .panel h3,[data-theme="dark"] th,[data-theme="dark"] tfoot td{background:#16223a;color:#c7d3e6}
[data-theme="dark"] tbody tr:hover{background:#16223a}
[data-theme="dark"] th.sortable:hover,[data-theme="dark"] th.sortable.on{background:#16223a}
[data-theme="dark"] .btn:hover{background:#1b2a44}
[data-theme="dark"] .btn.ghost:hover,[data-theme="dark"] .dhead .x:hover{background:#1b2a44;color:var(--ink)}
[data-theme="dark"] .field>span,[data-theme="dark"] .setting>span{color:#a9b8cf}
[data-theme="dark"] .tag{background:#16223a;border-color:#26364f;color:#c7d3e6}
[data-theme="dark"] .tag.ok{background:#0a2e1c;border-color:#166534;color:#6ee7a8}
[data-theme="dark"] .tag.warn{background:#33260a;border-color:#a16207;color:#fcd34d}
[data-theme="dark"] .tag.bad{background:#3a1414;border-color:#b91c1c;color:#fca5a5}
[data-theme="dark"] .tag.info{background:#0a2b2a;border-color:#0f766e;color:#5eead4}
[data-theme="dark"] .hintbox code{background:#16223a}
[data-theme="dark"] .side{background:#070d18}
[data-theme="dark"] .demo-bar{background:#33260a;border-color:#a16207;color:#fcd34d}
[data-theme="dark"] .demo-bar a{color:#fcd34d}

/* ---------- v3 追加：登录界面 / 用户标识 / 只读提示 ---------- */
.hidden{display:none!important}
.auth{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(13,148,136,.28),transparent 70%),
             linear-gradient(160deg,#0f172a,#111827 55%,#0b1220)}
.auth-card{width:min(366px,100%);background:var(--card);border-radius:14px;padding:24px 22px;
  box-shadow:0 24px 60px rgba(2,6,23,.55);border:1px solid rgba(148,163,184,.16)}
.auth-brand{font-size:17px;font-weight:700;letter-spacing:.5px}
.auth-sub{margin:6px 0 16px;font-size:12.5px;color:var(--muted);line-height:1.65}
.auth-card label{display:block;font-size:12.5px;color:#334155;font-weight:600;margin-bottom:11px}
.auth-card input{display:block;width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:#fff;font-weight:400}
.auth-card button{width:100%;margin-top:6px;padding:9px 12px}
.auth-err{min-height:17px;margin-top:9px;font-size:12.5px;color:var(--danger)}
.auth-foot{margin-top:15px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.75}
.auth-foot .mono{font-family:ui-monospace,Consolas,monospace}
.auth-card a{color:var(--accent-d)}
.userchip{display:flex;align-items:center;gap:4px;font-size:12.5px;margin-right:2px}
.userchip .who{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.userchip .role{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);background:#f8fafc;color:var(--muted)}
.userchip .role.admin{color:#9a3412;background:#fff7ed;border-color:#fed7aa}
.userchip .role.editor{color:var(--accent-d);background:#f0fdfa;border-color:#99f6e4}
.ro-bar{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:8px 12px;border-radius:8px;font-size:12.5px;line-height:1.6}
[data-theme="dark"] .auth-card{background:#111a2b;border-color:#22304a}
[data-theme="dark"] .auth-card label{color:#a9b8cf}
[data-theme="dark"] .auth-card input{background:#0b1220;color:var(--ink);border-color:var(--line)}
[data-theme="dark"] .userchip .role{background:#16223a;border-color:#26364f;color:#c7d3e6}
[data-theme="dark"] .userchip .role.admin{background:#33260a;border-color:#a16207;color:#fcd34d}
[data-theme="dark"] .userchip .role.editor{background:#0a2b2a;border-color:#0f766e;color:#5eead4}
[data-theme="dark"] .ro-bar{background:#0b2545;border-color:#1e40af;color:#bfdbfe}
</style>
</head>

<body>
<div class="app">
  <aside class="side">
    <div class="brand">🐭 实验室管理台<small>小鼠 · 繁育 · 试剂 · 耗材</small></div>
    <nav id="nav">
      <button data-view="dash" class="active">📊 概览</button>
      <button data-view="mice">🐭 小鼠统计</button>
      <button data-view="breeding">🐣 繁育台账</button>
      <button data-view="reagents">🧪 试剂</button>
      <button data-view="consumables">🧴 耗材</button>
      <button data-view="logs">📥 出入库流水</button>
      <button data-view="data">💾 数据 · 设置</button>
      <button data-view="users" data-admin="1" style="display:none">👥 账号管理</button>
      <button data-view="audit" data-admin="1" style="display:none">📋 操作日志</button>
    </nav>
    <div class="side-foot" id="saveInfo">尚无数据</div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="viewTitle">概览</h1>
      <div class="topActions" id="topActions"></div>
      <div id="userChip" class="userchip hidden"></div>
      <button class="btn mini ghost" id="btn-theme" type="button" title="切换主题">🌓</button>
    </header>
    <div id="demoBar" class="demo-bar" style="display:none;margin:14px 22px 0"></div>
    <div id="roBar" class="ro-bar" style="display:none;margin:14px 22px 0"></div>
    <section id="content"></section>
  </main>
</div>

<div id="authScreen" class="auth hidden"></div>

<div id="modal" class="overlay hidden">
  <div class="dialog">
    <div class="dhead"><h3 id="mTitle">编辑</h3><button class="x" type="button" onclick="closeModal()">✕</button></div>
    <form id="mForm" autocomplete="off">
      <div class="dbody" id="mBody"></div>
      <div class="dfoot">
        <span class="hint" id="mHint"></span>
        <button type="button" class="btn" onclick="closeModal()">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="printArea"></div>
<div id="toast"></div>

<script>

"use strict";
/* ==========================================================================
 * 实验室管理台 · 单文件离线版
 * 小鼠 / 繁育 / 试剂 / 耗材 / 出入库 / 成本 / 备份
 *
 * 设计约束：
 *   1. 只有一个 index.html，双击就能用，不需要装任何东西；
 *   2. 数据全部留在本机浏览器 localStorage，不联网、不上传；
 *   3. 老版本数据必须能直接打开（键名 labmgmt.v1 永不改，靠 meta.v 迁移）。
 * ========================================================================== */

const KEY = "labmgmt.v1";          // 历史键名，勿改：改了老用户的数据就读不到
const SNAP_KEY = "labmgmt.snapshots"; // 每日自动快照
const THEME_KEY = "labmgmt.theme";    // 主题偏好（独立存，避免污染业务数据）
const DATA_V = 3;

/* index.html?demo=1 → 演示模式：载入示例数据、只读不存，用于在线预览 / 截图 */
const DEMO = /(^|[?&])demo(=|&|$)/.test(location.search);

/* ---------------------------- 基础工具 ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const pad2 = n => String(n).padStart(2, "0");
const num = v => { const n = parseFloat(String(v ?? "").replace(/[,，\s]/g, "")); return isNaN(n) ? 0 : n; };
const numOrNull = v => { const s = String(v ?? "").replace(/[,，\s]/g, ""); if (s === "") return null; const n = parseFloat(s); return isNaN(n) ? null : n; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = n => (Math.round(n * 10) / 10).toString();
const nf2 = n => (Math.round(n * 100) / 100).toString();
const money = n => (Math.round(n * 100) / 100).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cut = (s, n = 60) => { const t = String(s ?? ""); return t.length > n ? t.slice(0, n) + "…" : t; };
const todayStr = () => new Date().toLocaleDateString("sv-SE");

/* 日期：统一成 YYYY-MM-DD；兼容 Excel 里常见的 2026/10/28、2026.10.28、日期序列号 */
function isoDate(v) {
  if (v === null || v === undefined || v === "") return "";
  const s0 = String(v).trim();
  if (/^\d{5}(\.\d+)?$/.test(s0)) {
    const n = Number(s0);
    if (n > 20000 && n < 80000) {
      return new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000).toISOString().slice(0, 10);
    }
  }
  const m = s0.match(/^(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  const d = new Date(s0.replace(/\./g, "-"));
  return isNaN(d.getTime()) ? "" : d.toLocaleDateString("sv-SE");
}
function addDays(date, n) {
  if (!date) return "";
  const d = new Date(date + "T00:00:00");
  if (isNaN(d.getTime())) return "";
  d.setDate(d.getDate() + n);
  return d.toLocaleDateString("sv-SE");
}
/* 距离今天还有多少天：正数=将来，负数=已过去，空/非法=null */
function dayDiff(date) {
  if (!date) return null;
  const d = new Date(date + "T00:00:00");
  if (isNaN(d.getTime())) return null;
  return Math.round((d.getTime() - new Date(todayStr() + "T00:00:00").getTime()) / 86400000);
}
function download(text, filename, mime) {
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------------------------- 数据层 ---------------------------- */
function blankState() {
  return {
    mice: [], breeding: [], reagents: [], consumables: [], logs: [],
    settings: {
      expWarn: 30, gestDays: 20, weanDays: 21, cardLayout: "6", snapshots: 7,
      usageDays: 90,    // 消耗预测的统计窗口（天）
      reorderDays: 30,  // 库存还能撑几天时提醒补货
      theme: "auto"     // auto / light / dark
    },
    meta: { v: DATA_V, updated: null, createdAt: null }
  };
}

/* 把任意来源（老数据 / JSON 备份 / 表格导入）的记录修剪成统一形状 */
function normalizeRecord(kind, r) {
  const o = Object.assign({}, r);
  if (!o.id) o.id = uid();
  if (!o.createdAt) o.createdAt = new Date().toISOString();
  if (kind === "mice") {
    o.strain = String(o.strain || "").trim();
    o.cages = numOrNull(o.cages) ?? 0;
    o.perCage = numOrNull(o.perCage) ?? 0;
    o.ageWeeks = numOrNull(o.ageWeeks);
    o.dob = isoDate(o.dob);
    o.ageDate = isoDate(o.ageDate);
    o.status = o.status === "已结束" ? "已结束" : "在养";
  } else if (kind === "breeding") {
    o.strain = String(o.strain || "").trim();
    o.paired = isoDate(o.paired);
    o.pregCheck = isoDate(o.pregCheck);
    o.born = isoDate(o.born);
    o.weanedDate = isoDate(o.weanedDate);
    ["pups", "weanedCount", "destCages", "destPerCage"].forEach(k => { o[k] = numOrNull(o[k]); });
    if (["配对中", "怀孕", "哺乳", "已断奶", "已结束"].indexOf(o.status) < 0) o.status = "配对中";
  } else {
    o.name = String(o.name || "").trim();
    o.qty = numOrNull(o.qty) ?? 0;
    o.min = numOrNull(o.min) ?? 0;
    if (kind === "reagents") {
      o.unitPrice = numOrNull(o.unitPrice);
      o.openDate = isoDate(o.openDate);
      o.expiry = isoDate(o.expiry);
    }
  }
  return o;
}

function migrate(raw) {
  const b = blankState();
  if (!raw || typeof raw !== "object") return b;
  return {
    mice: (Array.isArray(raw.mice) ? raw.mice : []).map(r => normalizeRecord("mice", r)),
    breeding: (Array.isArray(raw.breeding) ? raw.breeding : []).map(r => normalizeRecord("breeding", r)),
    reagents: (Array.isArray(raw.reagents) ? raw.reagents : []).map(r => normalizeRecord("reagents", r)),
    consumables: (Array.isArray(raw.consumables) ? raw.consumables : []).map(r => normalizeRecord("consumables", r)),
    logs: (Array.isArray(raw.logs) ? raw.logs : []).map(l => {
      const o = Object.assign({}, l);
      if (!o.id) o.id = uid();
      o.date = isoDate(o.date) || todayStr();
      o.qty = num(o.qty);
      o.unitPrice = numOrNull(o.unitPrice);
      o.amount = numOrNull(o.amount);
      if (o.amount === null && o.unitPrice !== null) o.amount = Math.round(o.qty * o.unitPrice * 100) / 100;
      if (!o.ts) o.ts = new Date(o.date + "T00:00:00").getTime() || Date.now();
      return o;
    }),
    settings: Object.assign({}, b.settings, raw.settings || {}),
    meta: Object.assign({}, b.meta, raw.meta || {}, { v: DATA_V })
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blankState();
    return migrate(JSON.parse(raw));
  } catch (e) {
    console.warn("读取本地数据失败，已按空数据启动", e);
    return blankState();
  }
}

let state = DEMO ? blankState() : loadState();
if (DEMO) state.meta.demo = 1;

function save() {
  if (DEMO) { paintSaveInfo(); return true; } // 演示模式：只在内存里改，绝不写入本机存储
  state.meta.updated = Date.now();
  if (!state.meta.createdAt) state.meta.createdAt = state.meta.updated;
  if (MODE === "server") { queueSync(); paintSaveInfo(); return true; } // 多用户模式：推到服务器
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    dailySnapshot();
  } catch (e) {
    toast("保存失败：浏览器存储空间不足，请先到「数据 · 设置」导出 JSON 备份", true);
    paintSaveInfo();
    return false;
  }
  paintSaveInfo();
  return true;
}

function paintSaveInfo() {
  const t = state.meta.updated ? new Date(state.meta.updated) : null;
  const el = $("#saveInfo");
  if (!el) return;
  if (DEMO) {
    el.textContent = "演示模式：示例数据不保存\n下载 index.html 双击即可录入真实数据";
    el.style.whiteSpace = "pre-line";
    return;
  }
  if (MODE === "server") {
    el.style.whiteSpace = "pre-line";
    if (!ME) { el.textContent = "未登录\n输入账号密码后开始使用"; return; }
    const dirty = hasLocal();
    const t2 = lastSyncAt ? new Date(lastSyncAt) : null;
    const when = t2 ? `${pad2(t2.getHours())}:${pad2(t2.getMinutes())}` : "";
    el.textContent = dirty
      ? (syncing ? "正在保存到服务器…" : (lastSyncErr || "有改动待保存…"))
      : `已同步到服务器 ${when}\n${myName()}（${ROLE_TEXT[ME.role] || ME.role}）· Ctrl+Z 撤销`;
    return;
  }
  el.textContent = t
    ? `已自动保存 ${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())} ${pad2(t.getHours())}:${pad2(t.getMinutes())}\nv${state.meta.v} · Ctrl+Z 撤销 · Ctrl+K 搜索`
    : "尚无数据，改动会自动保存在本机";
  el.style.whiteSpace = "pre-line";
}

/* ---------- 每日快照：每天第一次保存时留一份，最多留 N 份 ---------- */
function readSnapshots() {
  try {
    const list = JSON.parse(localStorage.getItem(SNAP_KEY) || "[]");
    return Array.isArray(list) ? list.filter(s => s && s.date && typeof s.json === "string") : [];
  } catch (e) { return []; }
}
function dailySnapshot() {
  const today = todayStr();
  const list = readSnapshots();
  if (list.length && list[0].date === today) return;
  const json = JSON.stringify(state);
  if (json.length > 1200000) return; // 数据太大就不占空间了
  list.unshift({ date: today, ts: Date.now(), json });
  const keep = Math.max(1, Math.min(30, num(state.settings.snapshots) || 7));
  localStorage.setItem(SNAP_KEY, JSON.stringify(list.slice(0, keep)));
}
function snapshotInfo() {
  const list = readSnapshots();
  return { list, bytes: list.reduce((n, s) => n + s.json.length, 0) };
}
function restoreSnapshot(date) {
  const s = readSnapshots().find(x => x.date === date);
  if (!s) { toast("快照不存在，可能已被清理", true); return; }
  if (!confirm(`用 ${date} 的自动快照覆盖当前数据？\n当前数据会先放进撤销栈（Ctrl+Z 可回退）。`)) return;
  pushUndo("恢复快照 " + date);
  try { state = migrate(JSON.parse(s.json)); } catch (e) { toast("快照已损坏，无法恢复", true); return; }
  save();
  render();
  toast("已恢复到 " + date + " 的快照");
}

/* ---------- 撤销：每次写操作前压一份状态，Ctrl+Z 回退 ---------- */
const undoStack = [];
function pushUndo(label) {
  try { undoStack.push({ label: label || "操作", json: JSON.stringify(state) }); } catch (e) { return; }
  if (undoStack.length > 20) undoStack.shift();
  paintUndo();
}
function paintUndo() {
  const box = $("#topActions");
  if (!box) return;
  const has = undoStack.length > 0;
  box.innerHTML = `<button class="btn mini ghost" id="btn-undo" type="button"${has ? "" : " disabled"} title="Ctrl+Z">↩ 撤销${has ? "（" + esc(cut(undoStack[undoStack.length - 1].label, 14)) + "）" : ""}</button>`;
  const b = $("#btn-undo");
  if (b) b.onclick = undo;
}
function undo() {
  const snap = undoStack.pop();
  if (!snap) { toast("没有可撤销的操作", true); return; }
  try { state = migrate(JSON.parse(snap.json)); } catch (e) { toast("撤销失败", true); return; }
  save();
  render();
  toast("已撤销：" + snap.label);
}

/* ---------------------------- 提示条 ---------------------------- */
let toastTimer;
function toast(msg, isErr) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = msg;
  el.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ""; }, isErr ? 4500 : 2200);
}


/* ==========================================================================
 * 多用户模式（连服务器）
 *
 * 同一个 index.html 有两种活法：
 *   1. 双击打开（file://）或托管在静态空间 → 纯离线，数据在 localStorage，和以前一模一样；
 *   2. 由 node server/index.js 提供 → 先登录，数据在服务器，多人实时同步。
 *
 * 同步策略（为什么不会互相覆盖）：
 *   - 每次保存只发「变了的那几条记录」，按 id 合并，不是整库覆盖；
 *   - 记录上带 _by / _at，谁改的、什么时候改的，服务端审计里查得到；
 *   - 同一条记录两人同时改 → 后写的生效，对方下一次轮询会看到新版本并提示；
 *   - 断网时改动暂存在当前页面，恢复后自动重发（不静默丢失）。
 * ========================================================================== */
const ROLE_TEXT = { admin: "管理员", editor: "实验员", viewer: "只读" };
const COLLS = ["mice", "breeding", "reagents", "consumables", "logs"];

let MODE = DEMO ? "demo" : "offline";   // demo / offline / server
let ME = null;                          // 当前登录用户
let MY_PERMS = null;                    // 服务端下发的权限
let REV = 0;                            // 服务器修订号（用于增量拉取）
let SYNCED = null;                      // 最后一次同步成功时的数据快照
let syncTimer = null, syncing = false, lastSyncAt = 0, lastSyncErr = "", pollTimer = null;
let pendingRender = false;

const isAdmin = () => !!(MY_PERMS && MY_PERMS.manageUsers);
const canWrite = () => {
  if (MODE !== "server") return true;          // 离线版一直是原来自助的样子
  return !!(MY_PERMS && MY_PERMS.writeData);
};
const myName = () => (ME && (ME.name || ME.username)) || "";
const coreOf = s => ({
  mice: s.mice, breeding: s.breeding, reagents: s.reagents,
  consumables: s.consumables, logs: s.logs, settings: s.settings
});
const snapshotOf = s => JSON.parse(JSON.stringify(coreOf(s)));

/* 记录比较时忽略服务端打的时间戳，否则自己的改动会被反复重发 */
function stripped(rec) {
  const o = {};
  for (const k in rec) if (k !== "_by" && k !== "_at") o[k] = rec[k];
  return o;
}
const canonical = rec => {
  const s = stripped(rec);
  return JSON.stringify(s, Object.keys(s).sort());
};

function buildPatch(base, cur) {
  const patch = {};
  for (const coll of COLLS) {
    const bmap = new Map((base[coll] || []).map(r => [r.id, r]));
    const cmap = new Map((cur[coll] || []).map(r => [r.id, r]));
    const up = [], del = [];
    cmap.forEach((r, id) => {
      if (!r || !id) return;
      const o = bmap.get(id);
      if (!o || canonical(o) !== canonical(r)) up.push(stripped(r));
    });
    bmap.forEach((r, id) => { if (!cmap.has(id)) del.push(id); });
    if (up.length || del.length) patch[coll] = { up, del };
  }
  if (MY_PERMS && MY_PERMS.writeSettings && JSON.stringify(base.settings) !== JSON.stringify(cur.settings)) {
    patch.settings = cur.settings;
  }
  return patch;
}

const hasLocal = () => !!SYNCED && Object.keys(buildPatch(SYNCED, coreOf(state))).length > 0;

/* ---------------------------- 登录界面 ---------------------------- */
const AUTH_HINT = {
  bad_credentials: "用户名或密码不对。忘了密码请找管理员重置。",
  locked: "尝试次数太多，稍等几分钟再试。",
  disabled: "这个账号已被停用，请联系管理员。"
};

function showAuth(opts) {
  const o = opts || {};
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  const el = $("#authScreen");
  if (!el) return;
  el.classList.remove("hidden");
  const err = o.error || "";
  el.innerHTML = o.forceChange ? `
    <div class="auth-card">
      <div class="auth-brand">🔒 先设置你自己的密码</div>
      <p class="auth-sub">第一次登录必须改密码：初始密码是管理员给的，别人也知道，不能继续用。</p>
      <form id="authForm" autocomplete="off">
        <label>原密码（管理员给的）<input type="password" id="authOld" required autocomplete="current-password"></label>
        <label>新密码（至少 6 位，需含大写字母 + 数字 + 特殊符号）<input type="password" id="authNew" required autocomplete="new-password"></label>
        <label>再输一次<input type="password" id="authNew2" required autocomplete="new-password"></label>
        <button class="btn primary" type="submit">${o.busy ? "提交中…" : "保存并进入"}</button>
        <div class="auth-err" id="authErr">${esc(err)}</div>
      </form>
      <div class="auth-foot">${esc(ME ? myName() : "")} · <a href="#" id="authLogout">退出</a></div>
    </div>` : `
    <div class="auth-card">
      <div class="auth-brand">🐭 实验室管理台</div>
      <p class="auth-sub">小鼠 · 繁育 · 试剂 · 耗材 · 多用户版</p>
      <form id="authForm" autocomplete="off">
        <label>用户名<input id="authUser" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
        <label>密码<input type="password" id="authPw" required autocomplete="current-password"></label>
        <button class="btn primary" type="submit">${o.busy ? "登录中…" : "登录"}</button>
        <div class="auth-err" id="authErr">${esc(err)}</div>
      </form>
      <div class="auth-foot">
        没有账号？找实验室管理员开。<br>
        <span class="mono">${esc(location.host)}</span>
      </div>
    </div>`;

  const form = $("#authForm");
  if (o.forceChange) {
    form.onsubmit = async e => {
      e.preventDefault();
      const oldPw = $("#authOld").value, a = $("#authNew").value, b = $("#authNew2").value;
      if (a !== b) { $("#authErr").textContent = "两次输入的新密码不一样"; return; }
      showAuth(Object.assign({}, o, { forceChange: true, busy: true }));
      const r = await fetch("/api/password", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ old: oldPw, new: a })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { showAuth({ forceChange: true, error: j.error || "改密码失败" }); return; }
      toast("密码已更新");
      await enterApp();
    };
    $("#authLogout").onclick = e => { e.preventDefault(); remoteLogout(true); };
  } else {
    form.onsubmit = async e => {
      e.preventDefault();
      const u = $("#authUser").value.trim(), p = $("#authPw").value;
      const btn = form.querySelector("button");
      btn.disabled = true; btn.textContent = "登录中…";
      $("#authErr").textContent = "";
      try {
        const r = await fetch("/api/login", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ username: u, password: p })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          $("#authErr").textContent = j.error || AUTH_HINT[j.code] || "登录失败";
          btn.disabled = false; btn.textContent = "登录";
          return;
        }
        ME = j.user; MY_PERMS = j.perms;
        await enterApp();
      } catch (err2) {
        $("#authErr").textContent = "连不上服务器：检查电脑和网络，或问管理员服务是否在运行";
        btn.disabled = false; btn.textContent = "登录";
      }
    };
    setTimeout(() => { const i = $("#authUser"); if (i) i.focus(); }, 50);
  }
}

function hideAuth() {
  const el = $("#authScreen");
  if (el) { el.classList.add("hidden"); el.innerHTML = ""; }
}

async function enterApp() {
  const r = await fetch("/api/bootstrap");
  if (r.status === 401) { ME = null; showAuth({ error: "登录已过期，请重新登录" }); return; }
  const j = await r.json().catch(() => null);
  /* 首次登录未改密码：服务端不让读数据，必须先改密码 */
  if (r.status === 403 && j && j.mustChangePassword) { showAuth({ forceChange: true }); return; }
  if (!j || !j.data) { showAuth({ error: (j && j.error) || "服务器返回异常" }); return; }
  if (j.user && j.user.mustChangePassword) { ME = j.user; MY_PERMS = j.perms; showAuth({ forceChange: true }); return; }
  ME = j.user || ME;
  MY_PERMS = j.perms || MY_PERMS;
  state = migrate(j.data);
  REV = j.rev;
  SYNCED = snapshotOf(state);
  lastSyncAt = Date.now();
  lastSyncErr = "";
  hideAuth();
  paintIdentity();
  render();
  startPolling();
  toast(`已登录：${myName()}（${ROLE_TEXT[ME.role] || ME.role}）`);
}

function paintIdentity() {
  const chip = $("#userChip");
  if (chip) {
    if (MODE === "server" && ME) {
      chip.classList.remove("hidden");
      chip.innerHTML = `<span class="who" title="${esc(ME.username)}">👤 ${esc(myName())}<span class="role ${esc(ME.role)}">${esc(ROLE_TEXT[ME.role] || ME.role)}</span></span>
        <button class="btn mini ghost" id="btnPw" type="button" title="修改我的密码">🔑</button>
        <button class="btn mini ghost" id="btnLogout" type="button" title="退出登录">退出</button>`;
      $("#btnLogout").onclick = () => remoteLogout(false);
      $("#btnPw").onclick = changeMyPassword;
    } else {
      chip.classList.add("hidden");
      chip.innerHTML = "";
    }
  }
  $$("#nav button[data-admin]").forEach(b => { b.style.display = isAdmin() ? "" : "none"; });
  const ro = $("#roBar");
  if (ro) {
    const showRo = MODE === "server" && !canWrite();
    ro.style.display = showRo ? "" : "none";
    if (showRo) ro.innerHTML = "🔒 <b>只读账号</b>：可以查看和导出，不能修改数据。需要录入请找管理员要「实验员」权限。";
  }
}

async function remoteLogout(silent) {
  if (!silent && hasLocal() && !confirm("还有改动没同步到服务器，确定退出？")) return;
  try { await flush(); } catch (e) { /* ignore */ }
  try { await fetch("/api/logout", { method: "POST" }); } catch (e) { /* ignore */ }
  ME = null; MY_PERMS = null; SYNCED = null; REV = 0;
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  state = blankState();
  paintIdentity();
  render();
  showAuth({});
}

function sessionLost() {
  if (MODE !== "server") return;
  ME = null; MY_PERMS = null; SYNCED = null;
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  showAuth({ error: "登录已过期，请重新登录（未同步的改动会保留在页面上）" });
}

function changeMyPassword() {
  const oldPw = prompt("当前密码：");
  if (oldPw === null) return;
  const a = prompt("新密码（至少 6 位，需含大写字母 + 数字 + 特殊符号）：");
  if (a === null) return;
  const b = prompt("再输一次新密码：");
  if (b === null) return;
  if (a !== b) { toast("两次输入不一样", true); return; }
  fetch("/api/password", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ old: oldPw, new: a })
  }).then(async r => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast(j.error || "改密码失败", true); return; }
    toast("密码已更新");

  }).catch(() => toast("网络错误，稍后再试", true));

/* ---------------------------- 同步 ---------------------------- */
function queueSync() {
  paintSaveInfo();
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; flush(); }, 600);
}

async function flush(keepalive) {
  if (MODE !== "server" || !ME || syncing || !SYNCED) return false;
  const snap = snapshotOf(state);
  const patch = buildPatch(SYNCED, snap);
  if (!Object.keys(patch).length) { SYNCED = snap; return true; }
  syncing = true;
  try {
    const r = await fetch("/api/sync", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ baseRev: REV, patch }),
      keepalive: !!keepalive
    });
    if (r.status === 401) { sessionLost(); return false; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      lastSyncErr = j.error || "HTTP " + r.status;
      toast("保存失败：" + lastSyncErr, true);
      return false;
    }
    REV = j.rev;
    SYNCED = snap;                 // 注意：用发送前的快照，避免把服务端的 _by 当成"又改了"
    lastSyncAt = Date.now();
    lastSyncErr = "";
    return true;
  } catch (e) {
    lastSyncErr = "网络断开，改动留在本页，联网后自动重发";
    return false;
  } finally {
    syncing = false;
    paintSaveInfo();
  }
}

function applyChanges(list) {
  let others = 0;
  const names = new Set();
  list.forEach(c => {
    if (!c || c.fullReplace) return;
    if (c.coll === "settings") {
      if (c.rec && !hasLocal()) state.settings = Object.assign({}, state.settings, c.rec);
      return;
    }
    const arr = state[c.coll];
    if (!arr) return;
    if (c.del) {
      const i = arr.findIndex(r => r.id === c.id);
      if (i >= 0) arr.splice(i, 1);
      return;
    }
    if (!c.rec) return;
    const i = arr.findIndex(r => r.id === c.id);
    if (i >= 0) arr[i] = c.rec; else arr.push(c.rec);
    if (c.rec._by && c.rec._by !== myName()) { others++; names.add(c.rec._by); }
  });
  return { others, names: [...names] };
}

/* 用户正在输入 / 正在填写弹窗时不要重绘，否则输入框会被清空 */
function softRender() {
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT" || ae.isContentEditable);
  const modalOpen = $("#modal") && !$("#modal").classList.contains("hidden");
  if (typing || modalOpen || !canWrite()) { pendingRender = true; return; }
  render();
}

async function poll(force) {
  if (MODE !== "server" || !ME || !SYNCED) return;
  if (document.hidden && !force) return;
  if (hasLocal()) await flush();
  if (hasLocal()) return;                 // 本地还没存完，先别动远端数据
  try {
    const r = await fetch(`/api/changes?since=${REV}`);
    if (r.status === 401) { sessionLost(); return; }
    const j = await r.json().catch(() => null);
    if (!j) return;
    if (j.full) {
      state = migrate(j.data);
      REV = j.rev;
      SYNCED = snapshotOf(state);
      render();
      toast("数据已整体刷新");
      return;
    }
    if (j.rev) REV = j.rev;
    if (j.changes && j.changes.length) {
      const info = applyChanges(j.changes);
      SYNCED = snapshotOf(state);
      softRender();
      if (info.others) toast(`${info.names.join("、")} 刚更新了 ${info.others} 条记录`);
    }
  } catch (e) { /* 网络抖动：下次轮询再说 */ }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => poll(false), 6000);
}

/* ---------------------------- 界面上的写操作拦截 ---------------------------- */
/* 服务端会拒，但前端先拦一下，体验更好（也不会留下"看起来改了其实没存"的迷惑） */
const WRITE_ACTS = ["new", "edit", "del", "copy", "toggle", "convert", "weannow", "stock", "imp-do"];
const ADMIN_ACTS = ["clear", "rs", "snap", "snap-clear", "save-set", "u-create", "u-del", "u-role", "u-disable", "u-reset"];

document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button[data-act]");
  if (!b || MODE !== "server") return;
  const act = b.dataset.act;
  let msg = "";
  if (WRITE_ACTS.indexOf(act) >= 0 && !canWrite()) msg = "只读账号不能修改数据";
  else if (ADMIN_ACTS.indexOf(act) >= 0 && !isAdmin()) msg = "只有管理员能做这个操作";
  if (msg) {
    e.preventDefault();
    e.stopPropagation();
    toast(msg, true);
  }
}, true);

document.addEventListener("submit", e => {
  if (MODE !== "server" || e.target.id !== "mForm") return;
  if (canWrite()) return;
  e.preventDefault();
  e.stopPropagation();
  toast("只读账号不能修改数据", true);
}, true);

/* 输入框失焦后再补一次被推迟的重绘 */
document.addEventListener("focusout", () => {
  setTimeout(() => { if (pendingRender) { pendingRender = false; softRender(); } }, 250);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(true); });
window.addEventListener("beforeunload", () => { if (MODE === "server" && hasLocal()) flush(true); });
window.addEventListener("online", () => { poll(true); });

  if (!r.ok) { toast(j.error || "修改失败", true); loadUsers(); return; }
  toast(okMsg);
  loadUsers();
}

async function bootRemote() {
  if (DEMO) return;
  if (location.protocol === "file:") return;      // 双击打开：就是离线版
  let r;
  try { r = await fetch("/api/me", { headers: { accept: "application/json" } }); }
  catch (e) { return; }                            // 打不开就按离线处理
  const ct = String(r.headers.get("content-type") || "");
  if (ct.indexOf("json") < 0) return;              // GitHub Pages 之类静态托管 → 离线版
  let j = null;
  try { j = await r.json(); } catch (e) { return; }
  if (!j || !j.server) return;
  MODE = "server";
  paintIdentity();
  if (r.status === 401) { showAuth({}); return; }
  if (j.user && j.user.mustChangePassword) {
    ME = j.user; MY_PERMS = j.perms;
    showAuth({ forceChange: true });
    return;
  }
  await enterApp();
}

    { k: "spec", l: "规格", t: "text", ph: "如 96 支/盒 / 50 mL" },
    { k: "qty", l: "库存数量", t: "number", step: "any", min: 0, def: 0 },
    { k: "unit", l: "单位", t: "text", list: 1, ph: "盒 / 包 / 个 / 箱" },
    { k: "min", l: "安全库存", t: "number", step: "any", min: 0, def: 0, hint: "低于或等于此值时提醒补货" },
    { k: "unitPrice", l: "单价（元 / 单位）", t: "number", step: "any", min: 0, ph: "可留空" , hint: "用于出库成本统计" },
    { k: "location", l: "存放位置", t: "text", list: 1 },
    { k: "supplier", l: "供应商", t: "text", list: 1 },
    { k: "note", l: "备注", t: "textarea", wide: 1 }
  ]
};
const KIND_LABEL = { mice: "小鼠", breeding: "繁育", reagents: "试剂", consumables: "耗材" };

/* ============================== 计算 ============================== */
function ageOf(r) {
  if (r.dob) {
    const d = (Date.now() - new Date(r.dob + "T00:00:00").getTime()) / 86400000;
    return { w: d / 7, from: "dob" };
  }
  if (r.ageWeeks !== null && r.ageWeeks !== undefined && r.ageWeeks !== "") {
    let w = num(r.ageWeeks);
    const ref = r.ageDate || (r.createdAt ? r.createdAt.slice(0, 10) : todayStr());
    const back = dayDiff(ref);
    w += (back === null ? 0 : back) / -7;
    return { w, from: "manual", ref };
  }
  return { w: null, from: "none" };
}
const totalMice = r => num(r.cages) * num(r.perCage);
const isActive = r => (r.status || "在养") !== "已结束";
const expDays = r => (r.expiry ? dayDiff(r.expiry) : null);
const stockValue = r => num(r.qty) * num(r.unitPrice);
const isLow = r => num(r.min) > 0 && num(r.qty) <= num(r.min);

/* ---------- 消耗预测：按最近 N 天的「出库」流水估日均用量与可用天数 ---------- */
const usageWindow = () => Math.max(7, Math.min(730, num(state.settings.usageDays) || 90));
const reorderDays = () => Math.max(1, Math.min(365, num(state.settings.reorderDays) || 30));

function usageOf(kind, r) {
  const win = usageWindow();
  const since = addDays(todayStr(), -(win - 1));
  let sum = 0, n = 0, last = "";
  for (const l of state.logs) {
    if (l.kind !== kind || l.action !== "出库") continue;
    const sameItem = l.itemId ? l.itemId === r.id : String(l.itemName || "") === String(r.name || "");
    if (!sameItem) continue;
    const d = l.date || "";
    if (!d || d < since) continue;
    sum += num(l.qty);
    n++;
    if (d > last) last = d;
  }
  const day = sum / win;                        // 日均消耗量
  const qty = num(r.qty);
  const daysLeft = day > 0 ? qty / day : null;  // 还能用多少天
  return {
    win, sum, n, last, day, qty, daysLeft,
    due: daysLeft === null ? "" : addDays(todayStr(), Math.floor(daysLeft)),
    reorder: reorderDays()
  };
}
/* 建议补到多少：撑过「补货提前期 + 30 天」 */
const suggestQty = u => (u.day > 0 ? Math.ceil(u.day * (u.reorder + 30)) : 0);

const gestDays = () => Math.max(1, num(state.settings.gestDays) || 20);
const weanDays = () => Math.max(1, num(state.settings.weanDays) || 21);
const breedOpen = r => ["已断奶", "已结束"].indexOf(r.status || "配对中") < 0;
function breedStage(r) {
  const s = r.status || "配对中";
  if (s === "已断奶" || s === "已结束") return { key: "closed", label: s, cls: "" };
  if (r.born || s === "哺乳") return { key: "lact", label: "哺乳", cls: "info" };
  if (r.pregCheck || s === "怀孕") return { key: "preg", label: "怀孕", cls: "warn" };
  return { key: "pair", label: "配对中", cls: "ok" };
}
const expectBorn = r => r.born || (r.paired ? addDays(r.paired, gestDays()) : "");
const expectWean = r => r.weanedDate || (r.born ? addDays(r.born, weanDays()) : "");

/* ============================== 过滤 / 排序 ============================== */
const ui = {
  view: "dash",
  q: { mice: "", breeding: "", reagents: "", consumables: "", logs: "" },
  status: "all", strain: "all", cat: "all", logKind: "all", logProject: "all", breedStage: "all",
  sort: { mice: null, breeding: null, reagents: null, consumables: null, logs: { k: "date", dir: -1 } }
};

function filterMice() {
  const q = ui.q.mice.trim().toLowerCase();
  return state.mice.filter(r => {
    if (ui.status === "active" && !isActive(r)) return false;
    if (ui.status === "done" && isActive(r)) return false;
    if (ui.strain !== "all" && (r.strain || "") !== ui.strain) return false;
    if (!q) return true;
    return [r.strain, r.purpose, r.project, r.earTag, r.room, r.keeper, r.note, r.sex].join(" ").toLowerCase().includes(q);
  });
}
function filterStock(kind) {
  const q = ui.q[kind].trim().toLowerCase();
  return state[kind].filter(r => {
    if (kind === "reagents" && ui.cat !== "all" && (r.category || "") !== ui.cat) return false;
    if (!q) return true;
    return [r.name, r.catNo, r.brand, r.spec, r.category, r.location, r.supplier, r.note].join(" ").toLowerCase().includes(q);
  });
}
function filterLogs() {
  const q = ui.q.logs.trim().toLowerCase();
  return state.logs
    .filter(l => ui.logKind === "all" || l.kind === ui.logKind)
    .filter(l => ui.logProject === "all" || (l.project || "") === ui.logProject)
    .filter(l => !q || [l.itemName, l.action, l.operator, l.note, l.project].join(" ").toLowerCase().includes(q))
    .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.ts || 0) - (a.ts || 0));
}
function filterBreeding() {
  const q = ui.q.breeding.trim().toLowerCase();
  return state.breeding.filter(r => {
    const open = breedOpen(r);
    if (ui.breedStage === "open" && !open) return false;
    if (ui.breedStage === "closed" && open) return false;
    if (ui.breedStage === "preg" && !(open && !r.born)) return false;
    if (ui.breedStage === "wean" && !(open && r.born && !r.weanedDate)) return false;
    if (!q) return true;
    return [r.code, r.strain, r.father, r.mother, r.purpose, r.project, r.room, r.keeper, r.note].join(" ").toLowerCase().includes(q);
  });
}

function sortBy(list, sort, getters) {
  if (!sort || !sort.k || !getters[sort.k]) return list;
  const get = getters[sort.k], dir = sort.dir || 1;
  return list.slice().sort((a, b) => {
    const x = get(a), y = get(b);
    const ex = x === null || x === undefined || x === "", ey = y === null || y === undefined || y === "";
    if (ex && ey) return 0;
    if (ex) return 1;
    if (ey) return -1;
    if (x === y) return 0;
    return (x > y ? 1 : -1) * dir;
  });
}
function thSort(view, key, label, cls) {
  const s = ui.sort[view];
  const on = s && s.k === key;
  const arrow = on ? (s.dir > 0 ? " ▲" : " ▼") : "";
  return `<th class="sortable${on ? " on" : ""}${cls ? " " + cls : ""}" data-sort="${key}">${label}${arrow}</th>`;
}

/* ============================== 提醒 ============================== */
function alerts() {
  const out = [];
  const warn = num(state.settings.expWarn) || 30;
  state.reagents.forEach(r => {
    const d = expDays(r);
    if (d === null) return;
    if (d < 0) out.push({ cls: "bad", kind: "试剂", txt: `已过期 ${-d} 天`, name: r.name, extra: `${r.expiry} · ${r.location || ""}`, go: "reagents" });
    else if (d <= warn) out.push({ cls: "warn", kind: "试剂", txt: `${d} 天后过期`, name: r.name, extra: `${r.expiry} · ${r.location || ""}`, go: "reagents" });
  });
  ["reagents", "consumables"].forEach(kind => {
    state[kind].forEach(r => {
      if (isLow(r)) {
        out.push({
          cls: "warn", kind: KIND_LABEL[kind], txt: "库存不足", name: r.name,
          extra: `剩 ${nf2(num(r.qty))} ${r.unit || ""} / 下限 ${nf2(num(r.min))}`, go: kind
        });
        return; // 已经缺货就不再重复提示「快用完」
      }
      const u = usageOf(kind, r);
      if (u.daysLeft === null || u.daysLeft > u.reorder) return;
      const d = Math.max(0, Math.floor(u.daysLeft));
      out.push({
        cls: d <= 7 ? "bad" : "warn", kind: KIND_LABEL[kind],
        txt: d === 0 ? "库存已用尽" : `约 ${d} 天后用完`,
        name: r.name,
        extra: `日均 ${nf2(u.day)} ${r.unit || ""} · 剩 ${nf2(num(r.qty))} · 建议补 ${nf2(suggestQty(u))} ${r.unit || ""}`,
        go: kind
      });
    });
  });
  state.breeding.filter(breedOpen).forEach(r => {
    const name = `${r.strain || "繁育"}${r.code ? " · " + r.code : ""}`;
    const extra = `${r.father || "-"} × ${r.mother || "-"} · ${r.room || ""}`;
    if (!r.born) {
      const d = dayDiff(expectBorn(r));
      if (d === null) return;
      if (d < -7) out.push({ cls: "bad", kind: "繁育", txt: `超预产期 ${-d} 天`, name, extra, go: "breeding" });
      else if (d < 0) out.push({ cls: "warn", kind: "繁育", txt: `已到预产期（${-d} 天）`, name, extra, go: "breeding" });
      else if (d <= 3) out.push({ cls: "warn", kind: "繁育", txt: `预计 ${d} 天内生产`, name, extra: expectBorn(r), go: "breeding" });
    } else if (!r.weanedDate) {
      const d = dayDiff(expectWean(r));
      if (d === null) return;
      if (d < 0) out.push({ cls: "bad", kind: "繁育", txt: `该断奶了（超 ${-d} 天）`, name, extra: `出生 ${r.born} · ${r.pups || "?"} 仔`, go: "breeding" });
      else if (d <= 3) out.push({ cls: "warn", kind: "繁育", txt: `${d} 天后断奶`, name, extra: `出生 ${r.born} · ${r.pups || "?"} 仔`, go: "breeding" });
    }
  });
  const rank = { bad: 0, warn: 1 };
  return out.sort((a, b) => (rank[a.cls] ?? 2) - (rank[b.cls] ?? 2));
}

/* 近期繁育节点：预产 / 断奶 */
function breedingTimeline() {
  const ev = [];
  state.breeding.filter(breedOpen).forEach(r => {
    if (!r.born) {
      const d = expectBorn(r);
      if (d) ev.push({ date: d, day: dayDiff(d), txt: "预计生产", r });
    } else if (!r.weanedDate) {
      const d = expectWean(r);
      if (d) ev.push({ date: d, day: dayDiff(d), txt: "预计断奶", r });
    }
  });
  return ev.sort((a, b) => String(a.date).localeCompare(String(b.date))).slice(0, 8);
}

/* ============================== 小图表（纯 div，无外部依赖） ============================== */
function hBarsHTML(items, unitTxt) {
  if (!items.length) return '<div class="muted">暂无数据</div>';
  const max = Math.max(...items.map(i => i.value)) || 1;
  return `<div class="hbars">${items.map(i => `
    <div class="hrow" title="${esc(i.label)}：${nf(i.value)}${esc(unitTxt || "")}">
      <span class="hl">${esc(i.label)}</span>
      <span class="hb"><i style="width:${Math.max(2, (i.value / max) * 100).toFixed(1)}%"></i></span>
      <b class="hv">${nf(i.value)}</b>
    </div>`).join("")}</div>`;
}

/* 近 N 天每天出入库笔数：入库在下（绿）、出库在上（青） */
function stockTrend(days) {
  const start = addDays(todayStr(), -(days - 1));
  const map = {};
  for (let i = 0; i < days; i++) { const d = addDays(start, i); map[d] = { date: d, inQ: 0, outQ: 0 }; }
  state.logs.forEach(l => {
    const o = map[l.date || ""];
    if (!o) return;
    if (l.action === "入库") o.inQ++; else o.outQ++;
  });
  return Object.values(map);
}
function trendHTML(list) {
  const max = Math.max(1, ...list.map(d => d.inQ + d.outQ));
  const bars = list.map(d => {
    const tot = d.inQ + d.outQ;
    const hOf = v => (tot ? (v / tot) * 100 : 0).toFixed(1);
    const hpx = tot ? (tot / max) * 100 : 0;
    return `<div class="bar" style="height:${hpx.toFixed(1)}%" title="${esc(d.date)}：入库 ${d.inQ} 笔 / 出库 ${d.outQ} 笔">
      <i class="i-out" style="height:${hOf(d.outQ)}%"></i><i class="i-in" style="height:${hOf(d.inQ)}%"></i>
    </div>`;
  }).join("");
  const first = list[0] ? list[0].date : "";
  return `<div class="trend">${bars}</div>
    <div class="trend-x"><span>${esc(first)}</span><span>共 ${list.reduce((s, d) => s + d.inQ + d.outQ, 0)} 笔流水</span><span>今天</span></div>`;
}

            <td>${esc(l.project || "") || '<span class="muted">—</span>'}</td>
            <td>${esc(l.operator || "")}</td><td class="wrap-cell">${esc(cut(l.note, 40))}</td></tr>`).join("")
        || '<tr><td colspan="9" class="empty">暂无流水</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;

  $("#content").onclick = e => {
    const b = e.target.closest("button[data-go]");

const MICE_SORT = {

  cages: r => num(r.cages),
  perCage: r => num(r.perCage),
  total: r => totalMice(r),
  purpose: r => r.purpose || "",
  status: r => (isActive(r) ? 0 : 1),
  project: r => r.project || ""
};

function viewMice() {

    <div class="toolbar">
      <input id="q-mice" class="search" placeholder="搜索 品系 / 实验目的 / 项目 / 耳号 / 房间 / 负责人（Ctrl+K）" value="${esc(ui.q.mice)}">
      <select id="f-status">

        <option value="done"${ui.status === "done" ? " selected" : ""}>仅已结束</option>
      </select>
      <select id="f-strain"><option value="all">全部品系</option>${strains.map(s => `<option value="${esc(s)}"${ui.strain === s ? " selected" : ""}>${esc(s)}</option>`).join("")}</select>

    <div class="panel">
      <h3>小鼠记录 <em>周龄填出生日期后自动更新；只数 = 笼数 × 只数/笼；点表头排序</em></h3>

  $("#f-strain").onchange = e => { ui.strain = e.target.value; rowsMice(); statsMice(); };
  $("#f-layout").onchange = e => { state.settings.cardLayout = e.target.value; save(); toast("笼牌版式已保存"); };

function statsMice() {
  const list = filterMice(), act = list.filter(isActive);
  const cages = act.reduce((s, r) => s + num(r.cages), 0);

  $("#miceStats").innerHTML = `
    <div class="stat card"><div class="k">在养总只数</div><div class="v">${nf(mice)}</div><div class="s">筛选结果内</div></div>

    <div class="stat card"><div class="k">记录条数</div><div class="v">${list.length}</div><div class="s">在养 ${act.length} / 已结束 ${list.length - act.length}</div></div>`;

    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="2">显示 ${list.length} 条（在养 ${act.length} 条）</td><td class="num">${nf(tc)}</td><td class="num"></td><td class="num">${nf(tm)}</td><td colspan="4"></td></tr></tfoot>
  </table>`;
  paintUndo();
}

    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="9">显示 ${list.length} 条（进行中 ${list.filter(breedOpen).length} 条）</td></tr></tfoot>

/* ============================== 视图：试剂 / 耗材 ============================== */
const STOCK_SORT = {
  name: r => r.name || "",
  category: r => r.category || "",
  qty: r => num(r.qty),
  min: r => num(r.min),
  value: r => stockValue(r),
  price: r => num(r.unitPrice),
  expiry: r => (r.expiry || "9999-12-31"),
  location: r => r.location || "",
  supplier: r => r.supplier || "",
  runout: r => { const u = usageOf(ui.view === "consumables" ? "consumables" : "reagents", r); return u.daysLeft === null ? 999999 : u.daysLeft; }
};

function viewStock(kind) {
  const isRe = kind === "reagents";
  const cats = isRe ? [...new Set(state.reagents.map(r => r.category).filter(Boolean))].sort() : [];
  $("#content").innerHTML = `
    <div class="toolbar">
      <input id="q-stock" class="search" placeholder="搜索 名称 / 货号 / 品牌 / 位置 / 供应商" value="${esc(ui.q[kind])}">
      ${isRe ? `<select id="f-cat"><option value="all">全部类别</option>${cats.map(c => `<option value="${esc(c)}"${ui.cat === c ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>` : ""}
      <button class="btn primary" data-act="new">+ 新增${isRe ? "试剂" : "耗材"}</button>
      <button class="btn" data-act="csv">导出 CSV</button>
    </div>
    <div class="cards" id="stockStats"></div>
    <div class="panel">
      <h3>${isRe ? "试剂库存" : "耗材库存"} <em>点「出入库」记流水（自动算金额）；「可用天数」按近 ${usageWindow()} 天出库量推算</em></h3>
      <div class="tablewrap" id="stockRows"></div>
    </div>
    <div class="panel">
      <h3>补货建议 <em>可用天数 ≤ ${reorderDays()} 天或已低于下限的品种；建议量按「撑过 ${reorderDays() + 30} 天」估算</em></h3>
      <div class="body" id="stockReorder"></div>
    </div>`;
  $("#q-stock").oninput = e => { ui.q[kind] = e.target.value; rowsStock(kind); statsStock(kind); };
  if (isRe) $("#f-cat").onchange = e => { ui.cat = e.target.value; rowsStock(kind); };
  $("#content .toolbar").onclick = e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    if (b.dataset.act === "new") openForm(kind);
    if (b.dataset.act === "csv") exportCSV(kind);
  };
  $("#stockRows").onclick = e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    const id = b.dataset.id;
    const act = b.dataset.act;
    if (act === "edit") openForm(kind, id);
    if (act === "del") delRecord(kind, id);
    if (act === "copy") copyRecord(kind, id);
    if (act === "stock") openStock(kind, id);
  };
  $("#stockReorder").onclick = e => {
    const b = e.target.closest("button[data-act]");
    if (b && b.dataset.act === "reorder-csv") exportCSV("reorder");
  };
  rowsStock(kind);
  statsStock(kind);
}

function statsStock(kind) {
  const list = filterStock(kind);
  const cats = new Set(list.map(r => r.category).filter(Boolean));
  const low = list.filter(isLow).length;
  const run = list.filter(r => {
    if (isLow(r)) return false;
    const u = usageOf(kind, r);
    return u.daysLeft !== null && u.daysLeft <= u.reorder;
  }).length;
  const exp = kind === "reagents" ? list.filter(r => r.expiry && expDays(r) !== null && expDays(r) <= (num(state.settings.expWarn) || 30)).length : 0;
  const val = list.reduce((s, r) => s + stockValue(r), 0);
  $("#stockStats").innerHTML = `
    <div class="stat card"><div class="k">品种数</div><div class="v">${list.length}</div><div class="s">${kind === "reagents" ? cats.size + " 个类别" : "耗材"}</div></div>
    <div class="stat card ${low ? "warn" : "ok"}"><div class="k">库存不足</div><div class="v">${low}</div><div class="s">低于或等于下限</div></div>
    <div class="stat card ${run ? "warn" : "ok"}"><div class="k">即将用完</div><div class="v">${run}</div><div class="s">可用 ≤ ${reorderDays()} 天</div></div>
    ${kind === "reagents"
      ? `<div class="stat card ${exp ? "warn" : "ok"}"><div class="k">临期 / 过期</div><div class="v">${exp}</div><div class="s">阈值 ${num(state.settings.expWarn) || 30} 天</div></div>`
      : `<div class="stat card"><div class="k">单位种类</div><div class="v">${new Set(list.map(r => r.unit).filter(Boolean)).size}</div><div class="s">按单位分别统计</div></div>`}
    <div class="stat card"><div class="k">库存金额</div><div class="v">${val ? "¥" + money(val) : "—"}</div><div class="s">库存 × 单价，未填单价不计</div></div>`;
}

function rowsStock(kind) {
  const isRe = kind === "reagents";
  const list = sortBy(filterStock(kind), ui.sort[kind], STOCK_SORT);
  if (!list.length) { $("#stockRows").innerHTML = `<div class="empty">还没有${isRe ? "试剂" : "耗材"}记录。</div>`; return; }
  const warn = num(state.settings.expWarn) || 30;
  const rows = list.map(r => {
    const q = num(r.qty), m = num(r.min);
    const lowCls = m > 0 && q <= m ? "bad" : "";
    const price = numOrNull(r.unitPrice);
    const u = usageOf(kind, r);
    const uCell = u.day > 0
      ? `<td class="num" title="近 ${u.win} 天出库 ${nf2(u.sum)} ${esc(r.unit || "")}（${u.n} 笔）· 预计 ${esc(u.due)} 用完 · 建议补 ${nf2(suggestQty(u))} ${esc(r.unit || "")}">
          <span class="muted" style="font-size:11.5px">${nf2(u.day)}${esc(r.unit ? " " + r.unit : "")}/天</span>
          <div><span class="tag ${u.daysLeft <= 7 ? "bad" : u.daysLeft <= u.reorder ? "warn" : "info"}">${Math.max(0, Math.floor(u.daysLeft))} 天</span></div>
        </td>`
      : `<td class="num"><span class="muted">—</span>${u.sum > 0 ? `<div class="muted" style="font-size:11px">窗口内无出库</div>` : ""}</td>`;
    let expCell = "";
    if (isRe) {
      const d = expDays(r);
      expCell = d === null ? '<span class="muted">—</span>'
        : d < 0 ? `<span class="tag bad">过期 ${-d} 天</span>`
        : d <= warn ? `<span class="tag warn">${d} 天后</span>`
        : `<span class="nowrap">${esc(r.expiry)}</span>`;
    }
    return `<tr>
      <td><b>${esc(r.name)}</b><div class="muted" style="font-size:11.5px">${esc([r.brand, r.catNo, r.spec].filter(Boolean).join(" · "))}</div></td>
      ${isRe ? `<td>${esc(r.category || "") || '<span class="muted">—</span>'}</td>` : ""}
      <td class="num"><span class="tag ${lowCls || "info"}">${nf2(q)} ${esc(r.unit || "")}</span>${m ? `<div class="muted" style="font-size:11px">下限 ${nf2(m)}</div>` : ""}</td>
      ${uCell}
      <td class="num">${price === null ? '<span class="muted">—</span>' : "¥" + nf2(price)}</td>
      <td class="num">${price === null ? '<span class="muted">—</span>' : "¥" + money(q * price)}</td>
      <td>${esc(r.location || "") || '<span class="muted">—</span>'}</td>
      ${isRe ? `<td class="nowrap">${expCell}</td>` : ""}
      <td>${esc(r.supplier || "") || '<span class="muted">—</span>'}</td>
      <td class="nowrap">
        <button class="btn mini" data-act="stock" data-id="${r.id}">出入库</button>
        <button class="btn mini" data-act="edit" data-id="${r.id}">编辑</button>
        <button class="btn mini" data-act="copy" data-id="${r.id}">复制</button>
        <button class="btn mini danger" data-act="del" data-id="${r.id}">删</button>
      </td></tr>`;
  }).join("");
  const cols = isRe ? 8 : 6;
  $("#stockRows").innerHTML = `<table>
    <thead><tr>${thSort(kind, "name", "名称 / 规格")}${isRe ? thSort(kind, "category", "类别") : ""}${thSort(kind, "qty", "库存", "num")}${thSort(kind, "runout", "日均 / 可用", "num")}${thSort(kind, "price", "单价", "num")}${thSort(kind, "value", "金额", "num")}<th>存放位置</th>${isRe ? thSort(kind, "expiry", "有效期") : ""}<th>供应商</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="${cols}">显示 ${list.length} 条 · 合计金额 ¥${money(list.reduce((s, r) => s + stockValue(r), 0))}</td><td></td></tr></tfoot>
  </table>`;

  const need = reorderList(kind);
  const box = $("#stockReorder");
  if (box) {
    box.innerHTML = need.length
      ? `<div class="items">${need.map(({ r, u }) => `<div class="row">
          <span class="tag ${u.daysLeft === null ? "warn" : u.daysLeft <= 7 ? "bad" : "warn"}">${u.daysLeft === null ? "已低于下限" : Math.max(0, Math.floor(u.daysLeft)) + " 天"}</span>
          <b>${esc(r.name)}</b>
          <span class="r">剩 ${nf2(num(r.qty))} ${esc(r.unit || "")}${u.day > 0 ? ` · 日均 ${nf2(u.day)} · 建议补 ${nf2(suggestQty(u))} ${esc(r.unit || "")}` : ""} · ${esc(r.supplier || "未填供应商")}</span>
        </div>`).join("")}</div>
        <div style="margin-top:10px"><button class="btn mini" data-act="reorder-csv">导出补货清单 CSV</button></div>`
      : '<div class="muted">🎉 暂无需要补货的品种。</div>';
  }
  paintUndo();
}

/* 需要补货的品种（低于下限，或按当前消耗撑不到提醒天数） */
function reorderList(kind) {
  return state[kind]
    .map(r => ({ r, u: usageOf(kind, r) }))
    .filter(o => isLow(o.r) || (o.u.daysLeft !== null && o.u.daysLeft <= o.u.reorder))
    .sort((a, b) => (a.u.daysLeft === null ? 1e9 : a.u.daysLeft) - (b.u.daysLeft === null ? 1e9 : b.u.daysLeft));
}


/* ============================== 视图：流水 ============================== */
function costSummary(list) {
  const byProject = {};
  list.forEach(l => {
    if (l.action !== "出库") return;
    const k = l.project || "(未归属项目)";
    const o = byProject[k] || (byProject[k] = { n: 0, qty: 0, amount: 0 });
    o.n++;
    o.qty += num(l.qty);
    o.amount += num(l.amount);
  });
  const byItem = {};
  list.forEach(l => {
    if (l.action !== "出库") return;
    const k = (l.kind === "reagents" ? "试剂 · " : "耗材 · ") + (l.itemName || "");
    const o = byItem[k] || (byItem[k] = { n: 0, qty: 0, amount: 0 });
    o.n++;
    o.qty += num(l.qty);
    o.amount += num(l.amount);
  });
  return { byProject, byItem };
}

function statsLogs() {
  const list = filterLogs();
  const inQ = list.filter(l => l.action === "入库").length;
  const outQ = list.filter(l => l.action === "出库").length;
  const last = list[0] ? list[0].date : "—";
  const month = todayStr().slice(0, 7);
  const monthOut = list.filter(l => l.action === "出库" && (l.date || "").slice(0, 7) === month).reduce((s, l) => s + num(l.amount), 0);
  $("#logStats").innerHTML = `
    <div class="stat card"><div class="k">流水条数</div><div class="v">${list.length}</div><div class="s">最近 ${esc(last)}</div></div>
    <div class="stat card"><div class="k">入库</div><div class="v" style="color:var(--ok)">${inQ}</div><div class="s">次</div></div>
    <div class="stat card"><div class="k">出库</div><div class="v" style="color:var(--accent-d)">${outQ}</div><div class="s">次</div></div>
    <div class="stat card"><div class="k">本月出库金额</div><div class="v">${monthOut ? "¥" + money(monthOut) : "—"}</div><div class="s">${month} · 按单价推算</div></div>`;
  paintCostPanels();
}

function paintCostPanels() {
  const list = filterLogs();

  const projRows = Object.entries(byProject).sort((a, b) => b[1].amount - a[1].amount).map(([k, o]) =>
    `<tr><td><b>${esc(k)}</b></td><td class="num">${o.n}</td><td class="num">${nf2(o.qty)}</td><td class="num">¥${money(o.amount)}</td></tr>`).join("");

    `<tr><td>${esc(k)}</td><td class="num">${nf2(o.qty)}</td><td class="num">¥${money(o.amount)}</td></tr>`).join("");

function saveSettings() {
  pushUndo("修改设置");
  state.settings.expWarn = Math.max(1, Math.min(365, num($("#set-exp").value) || 30));
  state.settings.gestDays = Math.max(1, Math.min(60, num($("#set-gest").value) || 20));
  state.settings.weanDays = Math.max(1, Math.min(60, num($("#set-wean").value) || 21));
  state.settings.snapshots = Math.max(1, Math.min(30, num($("#set-snap").value) || 7));
  state.settings.usageDays = Math.max(7, Math.min(730, num($("#set-usage").value) || 90));
  state.settings.reorderDays = Math.max(1, Math.min(365, num($("#set-reorder").value) || 30));
  save();
  render();
  toast("设置已保存");
}

function fieldHTML(kind, f, val) {
