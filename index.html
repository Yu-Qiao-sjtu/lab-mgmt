  switch (f.t) {
    case "textarea":
      input = `<textarea id="${id}" name="${f.k}" rows="2" placeholder="${esc(f.ph || "")}">${esc(val ?? "")}</textarea>`;
      break;
    case "select":
      input = `<select id="${id}" name="${f.k}">${(f.opts || []).map(o => `<option${o === (val ?? f.def ?? f.opts[0]) ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
      break;
    case "date":
      input = `<input id="${id}" name="${f.k}" type="date" value="${esc(val || "")}">`;
      break;
    case "number":
      input = `<input id="${id}" name="${f.k}" type="number" step="${f.step || "any"}" min="${f.min ?? 0}" value="${val === null || val === undefined || val === "" ? "" : esc(val)}" placeholder="${esc(f.ph || "")}">`;
      break;
    default:
      input = `<input id="${id}" name="${f.k}" type="text" value="${esc(val ?? "")}" placeholder="${esc(f.ph || "")}"${listAttr}>`;
  }
  return `<label class="field${f.wide ? " wide" : ""}"><span>${esc(f.l)}${f.req ? " <b>*</b>" : ""}</span>${input}${f.hint ? `<em>${esc(f.hint)}</em>` : ""}</label>`;
}

/* 下拉自动补全的值：本表已有值 + 自定义补充 */
function listValues(kind, key, extra) {
  const vals = new Set(state[kind].map(r => r[key]).filter(v => v !== "" && v !== null && v !== undefined));
  (extra || []).forEach(v => { if (v) vals.add(v); });
  return [...vals];
}

function openForm(kind, id) {
  const fields = SCHEMA[kind];
  const rec = id ? state[kind].find(x => x.id === id) : null;
  editing = { kind, id: id || null };
  const isNew = !rec;
  const title = { mice: "小鼠记录", breeding: "繁育配对", reagents: "试剂", consumables: "耗材" }[kind];

  const extra = kind === "mice" ? listValues("breeding", "strain") : [];
  const dl = fields.filter(f => f.list).map(f => {
    const vals = listValues(kind, f.k, f.k === "strain" ? extra : []);
    return `<datalist id="dl_${kind}_${f.k}">${vals.map(v => `<option value="${esc(v)}">`).join("")}</datalist>`;
  }).join("");

  $("#mTitle").textContent = (isNew ? "新增" : "编辑") + title;
  $("#mBody").innerHTML = dl + fields.map(f => fieldHTML(kind, f, rec ? rec[f.k] : (f.def ?? ""))).join("");
  $("#mHint").innerHTML = "";
  $("#modal").classList.remove("hidden");
  const first = $("#mBody input, #mBody select, #mBody textarea");
  if (first) setTimeout(() => first.focus(), 30);

  if (kind === "mice") hookMouseForm();
  if (kind === "breeding") hookBreedForm();
  $("#mForm").onsubmit = onSubmitForm;
}

function hookMouseForm() {
  const c = $("#f_cages"), p = $("#f_perCage"), dob = $("#f_dob"), aw = $("#f_ageWeeks"), ad = $("#f_ageDate");
  const hint = $("#mHint");
  if (!c || !p) return;
  const upd = () => {
    const t = num(c.value) * num(p.value);
    let s = `合计 <span class="total">${nf(t)}</span> 只`;
    if (dob.value) {
      const w = (Date.now() - new Date(dob.value + "T00:00:00").getTime()) / 86400000 / 7;
      s += ` · 按出生日期约 <span class="total">${nf(w)}</span> 周`;
    } else if (aw.value) {
      s += ` · 手填周龄 ${nf(num(aw.value))} 周`;
      if (ad.value) s += `（截至 ${esc(ad.value)}，按今天已 ${nf(num(aw.value) + (dayDiff(ad.value) || 0) / -7)} 周）`;
    }
    hint.innerHTML = s;
  };
  [c, p, dob, aw, ad].forEach(el => el && el.addEventListener("input", upd));
  upd();
}

function hookBreedForm() {
  const paired = $("#f_paired"), born = $("#f_born"), weaned = $("#f_weanedDate");
  const hint = $("#mHint");
  if (!paired) return;
  const upd = () => {
    const parts = [];
    if (born.value) {
      parts.push(`已出生 ${Math.max(0, -dayDiff(born.value))} 天`);
      if (!weaned.value) parts.push(`预计 ${addDays(born.value, weanDays())} 断奶`);
    } else if (paired.value) {
      parts.push(`预计 ${addDays(paired.value, gestDays())} 生产（合笼 + ${gestDays()} 天）`);
    }
    if (weaned.value) parts.push(`已于 ${weaned.value} 断奶`);
    hint.innerHTML = parts.join(" · ") || "填「合笼日期」后自动推算预产期";
  };
  [paired, born, weaned].forEach(el => el && el.addEventListener("input", upd));
  upd();
}

function readForm(kind) {
  const out = {};
  SCHEMA[kind].forEach(f => {
    const el = document.getElementById("f_" + f.k);
    if (!el) return;
    const v = el.value;
    if (f.t === "number") out[f.k] = v === "" ? null : num(v);
    else out[f.k] = String(v).trim();
  });
  return out;
}

function onSubmitForm(ev) {
  ev.preventDefault();
  const { kind, id } = editing;
  if (!kind || !SCHEMA[kind]) return;
  const data = readForm(kind);
  const missing = SCHEMA[kind].filter(f => f.req && (data[f.k] === "" || data[f.k] === null)).map(f => f.l);
  if (missing.length) { toast("请填写：" + missing.join("、"), true); return; }
  if (kind === "mice" && totalMice(data) <= 0) { toast("笼子数量和只数/笼都要大于 0，否则总只数为 0", true); return; }
  if (kind === "breeding" && data.born && data.paired && data.born < data.paired) {
    toast("出生日期早于合笼日期，请检查", true);
    return;
  }
  /* 繁育状态随里程碑自动推进（用户手动选了「已结束」则不动） */
  if (kind === "breeding" && data.status !== "已结束") {
    if (data.weanedDate) data.status = "已断奶";
    else if (data.born) { if (data.status === "配对中") data.status = "哺乳"; }
    else if (data.pregCheck && data.status === "配对中") data.status = "怀孕";
  }

  pushUndo(id ? `编辑${KIND_LABEL[kind]}` : `新增${KIND_LABEL[kind]}`);
  if (id) {
    const rec = state[kind].find(x => x.id === id);
    Object.assign(rec, normalizeRecord(kind, data), { updatedAt: new Date().toISOString() });
  } else {
    state[kind].unshift(Object.assign({ id: uid(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }, normalizeRecord(kind, data)));
  }
  save();
  closeModal();
  render();
  toast(id ? "已保存修改" : "已新增");
}

function closeModal() {
  $("#modal").classList.add("hidden");
  $("#mForm").onsubmit = null;
  editing = { kind: null, id: null };
}

function delRecord(kind, id) {
  const rec = state[kind].find(x => x.id === id);
  if (!rec) return;
  const name = kind === "mice" ? `${rec.strain}（${rec.purpose || ""}）`
    : kind === "breeding" ? `${rec.strain || ""} ${rec.code || ""}`
    : rec.name;
  if (!confirm(`确定删除「${name}」？\n删掉后可以按 Ctrl+Z 撤销。`)) return;
  pushUndo("删除" + KIND_LABEL[kind]);
  state[kind] = state[kind].filter(x => x.id !== id);
  save();
  render();
  toast("已删除，Ctrl+Z 可撤销");
}

function copyRecord(kind, id) {
  const rec = state[kind].find(x => x.id === id);
  if (!rec) return;
  pushUndo("复制" + KIND_LABEL[kind]);
  const copy = Object.assign({}, rec, { id: uid(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
  state[kind].unshift(normalizeRecord(kind, copy));
  save();
  render();
  openForm(kind, copy.id);
  toast("已复制一条，改完笼号/耳号再保存");
}

/* ============================== 出入库 ============================== */
function openStock(kind, id) {
  const r = state[kind].find(x => x.id === id);
  if (!r) return;
  editing = { kind: "__stock", id };
  const projects = [...new Set(state.logs.map(l => l.project).filter(Boolean))].sort();
  const price = numOrNull(r.unitPrice);
  $("#mTitle").textContent = `${r.name} · 出入库`;
  $("#mBody").innerHTML = `
    <div class="field wide"><span>当前库存</span><div style="padding:6px 0;font-weight:700;font-size:16px">${nf2(num(r.qty))} ${esc(r.unit || "")}${price !== null ? ` <span class="muted" style="font-size:12px;font-weight:400">· 单价 ¥${nf2(price)}</span>` : ""}</div></div>
    <label class="field"><span>日期</span><input type="date" name="date" value="${todayStr()}"></label>
    <label class="field"><span>动作</span><select name="action"><option>入库</option><option>出库</option></select></label>
    <label class="field"><span>数量 <b>*</b></span><input type="number" name="qty" step="any" min="0" placeholder="如 1"></label>
    <label class="field"><span>单价（元 / 单位）</span><input type="number" name="unitPrice" step="any" min="0" value="${price === null ? "" : esc(price)}" placeholder="留空则不计成本"></label>
    <label class="field"><span>项目 / 课题</span><input type="text" name="project" list="dl-projects" placeholder="如 PD-1 联合治疗"><datalist id="dl-projects">${projects.map(p => `<option value="${esc(p)}">`).join("")}</datalist></label>
    <label class="field"><span>操作人</span><input type="text" name="operator" placeholder="姓名"></label>
    <label class="field wide"><span>备注</span><textarea name="note" rows="2" placeholder="如 新到货 / 实验消耗 / 借出"></textarea></label>`;
  $("#mHint").innerHTML = "";
  $("#modal").classList.remove("hidden");
  const qtyEl = $('[name="qty"]'), priceEl = $('[name="unitPrice"]');
  const upd = () => {
    const q = num(qtyEl.value), p = numOrNull(priceEl.value);
    $("#mHint").innerHTML = p === null ? "填单价后自动算金额" : `本次金额约 <span class="total">¥${money(q * p)}</span>`;
  };
  [qtyEl, priceEl].forEach(el => el && el.addEventListener("input", upd));
  upd();
  setTimeout(() => qtyEl && qtyEl.focus(), 30);

  $("#mForm").onsubmit = ev => {
    ev.preventDefault();
    const fd = new FormData($("#mForm"));
    const qty = num(fd.get("qty"));
    if (qty <= 0) { toast("数量必须大于 0", true); return; }
    const action = String(fd.get("action"));
    if (action === "出库" && qty > num(r.qty)) { toast(`库存不足，当前只有 ${nf2(num(r.qty))} ${r.unit || ""}`, true); return; }
    const unitPrice = numOrNull(fd.get("unitPrice"));
    pushUndo(`${action} ${r.name}`);
    r.qty = Math.round((num(r.qty) + (action === "入库" ? qty : -qty)) * 100) / 100;
    if (unitPrice !== null) r.unitPrice = unitPrice;
    r.updatedAt = new Date().toISOString();
    state.logs.push({
      id: uid(), ts: Date.now(), date: String(fd.get("date")) || todayStr(),
      kind, itemId: r.id, itemName: r.name, unit: r.unit || "",
      action, qty,
      unitPrice,
      amount: unitPrice === null ? null : Math.round(qty * unitPrice * 100) / 100,
      project: String(fd.get("project") || "").trim(),
      operator: String(fd.get("operator") || "").trim(),
      note: String(fd.get("note") || "").trim()
    });
    save();
    closeModal();
    render();
    toast(`${action}成功，当前 ${nf2(num(r.qty))} ${r.unit || ""}`);
  };
}

/* ============================== 繁育 → 小鼠 ============================== */
function openConvert(id) {
  const r = state.breeding.find(x => x.id === id);
  if (!r) return;
  editing = { kind: "__convert", id };
  const count = num(r.weanedCount) || num(r.pups) || 0;
  const cages = num(r.destCages) || (count ? Math.ceil(count / 5) : 1);
  const perCage = num(r.destPerCage) || (cages ? Math.max(1, Math.round(count / cages)) : 5);
  $("#mTitle").textContent = `转成小鼠记录 · ${r.strain} ${r.code || ""}`;
  $("#mBody").innerHTML = `
    <div class="field wide"><span>来源</span><div class="muted" style="padding:4px 0">
      ${esc(r.strain)} · 父 ${esc(r.father || "-")} × 母 ${esc(r.mother || "-")} · 出生 ${esc(r.born || "—")} · ${count ? count + " 只仔鼠" : "未填仔数"}
    </div></div>
    <label class="field"><span>笼子数量 <b>*</b></span><input type="number" name="cages" step="1" min="1" value="${cages}"></label>
    <label class="field"><span>只数 / 笼 <b>*</b></span><input type="number" name="perCage" step="1" min="1" value="${perCage}"></label>
    <label class="field"><span>性别</span><select name="sex"><option>混合</option><option>雄</option><option>雌</option></select></label>
    <label class="field"><span>出生日期</span><input type="date" name="dob" value="${esc(r.born || "")}"></label>
    <label class="field wide"><span>实验目的</span><textarea name="purpose" rows="2">${esc(r.purpose || "繁育自产，断奶后备用")}</textarea></label>
    <label class="field"><span>项目 / 课题</span><input type="text" name="project" value="${esc(r.project || "")}"></label>
    <label class="field"><span>房间 / 架位</span><input type="text" name="room" value="${esc(r.room || "")}"></label>
    <label class="field"><span>负责人</span><input type="text" name="keeper" value="${esc(r.keeper || "")}"></label>`;
  $("#mHint").innerHTML = "";
  $("#modal").classList.remove("hidden");
  const cagesEl = $('[name="cages"]'), perEl = $('[name="perCage"]');
  const upd = () => { $("#mHint").innerHTML = `合计 <span class="total">${nf(num(cagesEl.value) * num(perEl.value))}</span> 只`; };
  [cagesEl, perEl].forEach(el => el && el.addEventListener("input", upd));
  upd();

  $("#mForm").onsubmit = ev => {
    ev.preventDefault();
    const fd = new FormData($("#mForm"));
    const data = {
      strain: r.strain, sex: String(fd.get("sex")), cages: num(fd.get("cages")), perCage: num(fd.get("perCage")),
      dob: isoDate(fd.get("dob")), purpose: String(fd.get("purpose") || "").trim() || "繁育自产",
      project: String(fd.get("project") || "").trim(), room: String(fd.get("room") || "").trim(),
      keeper: String(fd.get("keeper") || "").trim(),
      earTag: r.code ? "配对 " + r.code : "", status: "在养",
      note: `由繁育台账转入（配对 ${r.code || "-"}，母 ${r.mother || "-"}）`
    };
    if (totalMice(data) <= 0) { toast("笼数和只数/笼必须大于 0", true); return; }
    pushUndo("繁育转小鼠");
    state.mice.unshift(Object.assign({ id: uid(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }, normalizeRecord("mice", data)));
    if (!r.weanedDate) r.weanedDate = todayStr();
    if (!r.weanedCount) r.weanedCount = count || totalMice(data);
    r.status = "已断奶";
    r.updatedAt = new Date().toISOString();
    save();
    closeModal();
    setView("mice");
    toast("已生成小鼠记录，共 " + nf(totalMice(data)) + " 只");
  };
}

/* ============================== CSV 导出 ============================== */
function csvCell(v) {
  const s = String(v ?? "");
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(headers, rows) {
  return "\ufeff" + [headers.map(csvCell).join(",")].concat(rows.map(r => r.map(csvCell).join(","))).join("\r\n");
}
function exportCSV(kind) {
  const stamp = todayStr().replace(/-/g, "");
  let csv = "", name = "";
  if (kind === "mice") {
    name = `小鼠记录-${stamp}.csv`;
    const rows = sortBy(filterMice(), ui.sort.mice, MICE_SORT).map(r => {
      const a = ageOf(r);
      return [r.strain, r.sex, a.w === null ? "" : nf(a.w), r.dob || "", r.cages, r.perCage, totalMice(r),
        r.purpose, r.project, r.earTag, r.room, r.keeper, r.status || "在养", r.note];
    });
    csv = toCSV(["品系", "性别", "周龄", "出生日期", "笼数", "只数/笼", "总只数", "实验目的", "项目", "耳号/笼号", "房间/架位", "负责人", "状态", "备注"], rows);
  } else if (kind === "breeding") {
    name = `繁育台账-${stamp}.csv`;
    const rows = sortBy(filterBreeding(), ui.sort.breeding, BREED_SORT).map(r => [
      r.code, r.strain, r.father, r.mother, r.paired, r.pregCheck, r.born, r.pups, r.weanedDate, r.weanedCount,
      r.destCages, r.destPerCage, r.purpose, r.project, r.room, r.keeper, r.status || "配对中", r.note
    ]);
    csv = toCSV(["配对编号", "品系", "父本耳号", "母本耳号", "合笼日期", "孕检日期", "出生日期", "窝仔数", "断奶日期", "断奶只数", "分笼笼数", "分笼只数/笼", "实验目的", "项目", "房间/架位", "负责人", "状态", "备注"], rows);
  } else if (kind === "reagents") {
    name = `试剂库存-${stamp}.csv`;
    csv = toCSV(["名称", "货号", "品牌", "规格", "类别", "库存", "单位", "库存下限", "单价", "存放位置", "开封日期", "有效期至", "剩余天数", "供应商", "备注"],
      filterStock("reagents").map(r => [r.name, r.catNo, r.brand, r.spec, r.category, r.qty, r.unit, r.min, r.unitPrice,
        r.location, r.openDate, r.expiry, r.expiry ? dayDiff(r.expiry) : "", r.supplier, r.note]));
  } else if (kind === "consumables") {
    name = `耗材库存-${stamp}.csv`;
    csv = toCSV(["名称", "规格", "库存", "单位", "安全库存", "单价", "存放位置", "供应商", "备注"],
      filterStock("consumables").map(r => [r.name, r.spec, r.qty, r.unit, r.min, r.unitPrice, r.location, r.supplier, r.note]));
  } else if (kind === "logs") {
    name = `出入库流水-${stamp}.csv`;
    csv = toCSV(["日期", "类型", "物品", "动作", "数量", "单位", "单价", "金额", "项目", "操作人", "备注"],
      filterLogs().map(l => [l.date, l.kind === "reagents" ? "试剂" : "耗材", l.itemName, l.action, l.qty, l.unit, l.unitPrice, l.amount, l.project, l.operator, l.note]));
  } else if (kind === "reorder") {
    const stock = ui.view === "consumables" ? "consumables" : "reagents";
    name = `补货清单-${stamp}.csv`;
    csv = toCSV(["名称", "品牌", "货号", "规格", "单位", "当前库存", "日均消耗", "可用天数", "建议补货量", "供应商", "存放位置", "备注"],
      reorderList(stock).map(({ r, u }) => [r.name, r.brand, r.catNo, r.spec, r.unit, num(r.qty),
        u.day ? nf2(u.day) : "", u.daysLeft === null ? "" : Math.max(0, Math.floor(u.daysLeft)),
        u.day ? suggestQty(u) : "", r.supplier, r.location, r.note]));
  } else return;
  download(csv, name, "text/csv;charset=utf-8");
  toast("已导出 " + name);
}

/* ============================== JSON 备份 / 恢复 ============================== */
function backupJSON() {
  const stamp = todayStr().replace(/-/g, "");
  download(JSON.stringify(state, null, 2), `实验室管理备份-${stamp}.json`, "application/json");
  toast("备份已下载");
}
function importJSON(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      const looksOk = o && typeof o === "object" && (Array.isArray(o.mice) || Array.isArray(o.reagents) || Array.isArray(o.consumables) || Array.isArray(o.breeding));
      if (!looksOk) throw new Error("不是本工具的备份文件");
      const n = (o.mice || []).length + (o.reagents || []).length + (o.consumables || []).length + (o.breeding || []).length;
      if (!confirm(`即将用备份覆盖当前数据（小鼠 ${(o.mice || []).length} / 繁育 ${(o.breeding || []).length} / 试剂 ${(o.reagents || []).length} / 耗材 ${(o.consumables || []).length}）。\n当前数据会先放进撤销栈，可用 Ctrl+Z 回退。继续？`)) return;
      pushUndo("从 JSON 恢复");
      state = migrate(o);
      save();
      render();
      toast(`恢复成功，共 ${n} 条记录`);
    } catch (e) { toast("导入失败：" + e.message, true); }
    finally { const i = $("#fileImport"); if (i) i.value = ""; }
  };
  fr.readAsText(file, "utf-8");
}

/* ============================== 表格导入（Excel / CSV 粘贴） ============================== */
let importState = { kind: "mice", records: [], dups: 0, skipped: 0, headers: [], error: "" };

const IMPORT_ALIAS = {
  mice: {
    strain: ["品系", "strain", "品系名称"], sex: ["性别", "sex"], ageWeeks: ["周龄", "ageweeks", "周龄（周）"],
    dob: ["出生日期", "dob", "出生", "生日"], cages: ["笼数", "笼子数量", "cages", "笼"],
    perCage: ["只数/笼", "只数每笼", "percage", "per_cage", "每笼只数"], purpose: ["实验目的", "purpose", "目的"],
    project: ["项目", "项目/课题", "project", "课题"], earTag: ["耳号/笼号", "耳号", "笼号", "eartag", "ear_tag"],

  },
  breeding: {
    code: ["配对编号", "编号", "code"], strain: ["品系", "strain"], father: ["父本耳号", "父本", "father"],
    mother: ["母本耳号", "母本", "mother"], paired: ["合笼日期", "合笼", "paired", "配种日期"],
    pregCheck: ["孕检日期", "孕检", "pregcheck"], born: ["出生日期", "出生", "born"],
    pups: ["窝仔数", "仔数", "pups"], weanedDate: ["断奶日期", "断奶", "weaneddate"],
    weanedCount: ["断奶只数", "weanedcount"], destCages: ["分笼笼数", "destcages"],
    destPerCage: ["分笼只数/笼", "destpercage"], purpose: ["实验目的", "目的", "去 向", "purpose"],
    project: ["项目", "项目/课题", "project"], room: ["房间/架位", "房间", "架位", "room"],
    keeper: ["负责人", "keeper"], status: ["状态", "status"], note: ["备注", "note"]
  },
  reagents: {
    name: ["试剂名称", "名称", "name"], catNo: ["货号", "catno", "cat_no"], brand: ["品牌", "brand"],
    spec: ["规格", "spec"], category: ["类别", "category", "分类"], qty: ["库存数量", "库存", "qty", "数量"],
    unit: ["单位", "unit"], min: ["库存下限", "下限", "min", "安全库存"], unitPrice: ["单价", "unitprice", "unit_price", "单价（元/单位）"],
    location: ["存放位置", "位置", "location"], openDate: ["开封日期", "opendate"], expiry: ["有效期至", "有效期", "expiry", "到期日"],
    supplier: ["供应商", "supplier"], note: ["备注", "note"]
  },
  consumables: {
    name: ["耗材名称", "名称", "name"], spec: ["规格", "spec"], qty: ["库存数量", "库存", "qty"],
    unit: ["单位", "unit"], min: ["安全库存", "下限", "min"], unitPrice: ["单价", "unitprice"],
    location: ["存放位置", "位置", "location"], supplier: ["供应商", "supplier"], note: ["备注", "note"]
  }
};
const DUP_KEY = {
  mice: r => [r.strain, r.purpose, r.earTag, r.cages, r.perCage].join("|"),
  breeding: r => [r.code, r.strain, r.paired].join("|"),
  reagents: r => [r.name, r.catNo, r.spec, r.location].join("|"),
  consumables: r => [r.name, r.spec, r.location].join("|")
};
const normHeader = h => String(h || "").toLowerCase().replace(/[（(].*?[）)]/g, "").replace(/[\s_\-／/]/g, "");
function headerToKey(kind, h) {
  const n = normHeader(h);
  if (!n) return null;
  const map = IMPORT_ALIAS[kind] || {};
  for (const k in map) if (map[k].some(a => normHeader(a) === n)) return k;
  return null;
}
function splitDelimited(line, d) {
  const out = [];
  let cur = "", quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else quoted = false; }
      else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === d) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function parseTable(text) {
  const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n").filter(l => l.trim() !== "");
  if (!lines.length) return [];
  const head = lines[0];
  const tabs = (head.match(/\t/g) || []).length;
  const commas = (head.match(/,/g) || []).length;
  const semis = (head.match(/;/g) || []).length;
  const d = tabs >= commas && tabs >= semis ? "\t" : (semis > commas ? ";" : ",");
  return lines.map(l => splitDelimited(l, d));
}

function buildImport(kind, rows) {
  const out = { kind, records: [], dups: 0, skipped: 0, headers: [], error: "" };
  if (!rows.length) { out.error = "没有内容：先粘贴表格或选择文件"; return out; }
  const map = rows[0].map(h => headerToKey(kind, h));
  out.headers = map;
  if (!map.some(Boolean)) { out.error = "没认出表头：第一行需要是列名（例如 品系 / 笼数 / 只数/笼）"; return out; }
  const req = SCHEMA[kind].filter(f => f.req).map(f => f.k);
  const dupKeys = new Set(state[kind].map(r => DUP_KEY[kind](r)));
  rows.slice(1).forEach(cells => {
    const obj = {};
    map.forEach((k, i) => { if (k && cells[i] !== undefined) obj[k] = cells[i]; });
    const hasValue = Object.values(obj).some(v => String(v ?? "").trim() !== "");
    if (!hasValue) return;
    const rec = normalizeRecord(kind, obj);
    if (req.some(k => rec[k] === "" || rec[k] === null || rec[k] === undefined)) { out.skipped++; return; }
    if (kind === "mice" && totalMice(rec) <= 0) { out.skipped++; return; }
    if (dupKeys.has(DUP_KEY[kind](rec))) out.dups++;
    out.records.push(rec);
  });
  return out;
}

function importPreviewHTML() {
  const st = importState;
  if (st.error) return `<div class="tag bad">${esc(st.error)}</div>`;
  if (!st.records.length) return '<div class="muted">还没有解析结果。粘贴表格后点「解析预览」。</div>';
  const cols = SCHEMA[st.kind].slice(0, 6);
  const rows = st.records.slice(0, 8).map(r => `<tr>${cols.map(f => `<td>${esc(cut(r[f.k] ?? "", 24)) || '<span class="muted">—</span>'}</td>`).join("")}</tr>`).join("");
  return `<div class="tag info">解析到 ${st.records.length} 条${st.skipped ? `<span class="tag warn" style="margin-left:6px">跳过 ${st.skipped} 条（缺必填 / 只数为 0）</span>` : ""}${st.dups ? `<span class="tag warn" style="margin-left:6px">疑似重复 ${st.dups} 条</span>` : ""}</div>
    <div class="tablewrap" style="max-height:240px;margin-top:8px">
      <table><thead><tr>${cols.map(f => `<th>${esc(f.l)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="muted" style="margin-top:6px">预览前 8 条；确认导入会追加到现有数据（不会覆盖）。</div>`;
}

function previewImport() {
  const text = $("#imp-text") ? $("#imp-text").value : "";
  const kind = $("#imp-kind") ? $("#imp-kind").value : importState.kind;
  importState = buildImport(kind, parseTable(text));
  const box = $("#imp-preview");
  if (box) box.innerHTML = importPreviewHTML();
  if (importState.error) toast(importState.error, true);
  else if (!importState.records.length) toast("没有可导入的行，检查表头和内容", true);
}

function readImportFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const ta = $("#imp-text");
    if (ta) ta.value = String(fr.result || "");
    previewImport();
    const i = $("#impFile");
    if (i) i.value = "";
  };
  fr.readAsText(file, "utf-8");
}

function doImport() {
  const st = importState;
  if (!st.records.length) { toast("先点「解析预览」，确认能认出表头", true); return; }
  if (st.dups && !confirm(`有 ${st.dups} 条看起来和现有记录重复，仍然全部导入？`)) return;
  pushUndo(`导入${KIND_LABEL[st.kind]} ${st.records.length} 条`);
  state[st.kind] = st.records.concat(state[st.kind]);
  save();
  const n = st.records.length;
  importState = { kind: st.kind, records: [], dups: 0, skipped: 0, headers: [], error: "" };
  render();
  toast(`已导入 ${n} 条${KIND_LABEL[st.kind]}记录`);
}

/* ============================== 主题（浅色 / 深色 / 跟随系统） ============================== */
const THEMES = ["auto", "light", "dark"];
const THEME_LABEL = { auto: "跟随系统", light: "浅色", dark: "深色" };
let themeMode = (() => {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (THEMES.indexOf(saved) >= 0) return saved;
  } catch (e) { /* 隐私模式读不到 localStorage 也没关系 */ }
  return THEMES.indexOf(state.settings.theme) >= 0 ? state.settings.theme : "auto";
})();
const prefersDark = () => !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);

function applyTheme() {
  const dark = themeMode === "dark" || (themeMode === "auto" && prefersDark());
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.style.colorScheme = dark ? "dark" : "light";
  const b = $("#btn-theme");
  if (b) {
    b.textContent = themeMode === "auto" ? "🌓" : dark ? "🌙" : "☀️";
    b.title = `主题：${THEME_LABEL[themeMode]}（点击切换）`;
  }
}
function cycleTheme() {
  themeMode = THEMES[(THEMES.indexOf(themeMode) + 1) % THEMES.length];
  try { localStorage.setItem(THEME_KEY, themeMode); } catch (e) { /* ignore */ }
  if (MODE !== "server") {
    state.settings.theme = themeMode;   // 跟着 JSON 备份走，换机器也能带上
    save();
  }
  applyTheme();
  toast("主题：" + THEME_LABEL[themeMode]);
}

  if (!VIEWS[v]) v = "dash";
  ui.view = v;
  $$("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  render();

}

  const meta = TITLES[ui.view] || TITLES.dash;

  const th = e.target.closest("th[data-sort]");
  if (!th) return;
  const key = th.dataset.sort;

  ui.sort[ui.view] = cur && cur.k === key ? { k: key, dir: -cur.dir } : { k: key, dir: 1 };

});

  const b = e.target.closest("button[data-view]");

  ui.cat = "all";
  ui.logKind = "all";
  ui.logProject = "all";
  setView(b.dataset.view);
});

document.addEventListener("keydown", e => {
  const modalOpen = !$("#modal").classList.contains("hidden");
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === "Escape" && modalOpen) closeModal();
  if (mod && e.key === "Enter" && modalOpen) { const f = $("#mForm"); if (f) f.requestSubmit(); }
  if (mod && !e.shiftKey && String(e.key).toLowerCase() === "z" && !modalOpen) { e.preventDefault(); undo(); }
  if (mod && String(e.key).toLowerCase() === "k") {
    e.preventDefault();
    const s = document.querySelector("#content .search");
    if (s) { s.focus(); s.select(); }
  }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
$("#btn-theme").onclick = cycleTheme;
applyTheme();
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", () => { if (themeMode === "auto") applyTheme(); });
