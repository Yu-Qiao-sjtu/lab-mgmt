<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验室管理台 · 小鼠 / 试剂 / 耗材</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --accent:#0d9488; --accent-d:#0f766e; --warn:#b45309; --danger:#dc2626; --ok:#15803d;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}

/* ---------- 侧栏 ---------- */
.side{background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 16px 12px;font-size:15px;font-weight:600;color:#fff;letter-spacing:.5px}
.brand small{display:block;font-weight:400;font-size:11px;color:#64748b;margin-top:2px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:2px;padding:8px}
nav button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;color:#cbd5e1;cursor:pointer;font-size:13.5px}
nav button:hover{background:#1e293b;color:#fff}
nav button.active{background:var(--accent);color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:12px 16px;font-size:11px;color:#64748b;border-top:1px solid #1e293b;word-break:break-all}

/* ---------- 主区 ---------- */
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h1{font-size:17px;margin:0;font-weight:600}
.topbar h1 span{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.topActions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#content{padding:18px 22px 60px}

.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:#cbd5e1;background:#fafafa}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-d)}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.mini{padding:3px 8px;font-size:12px;box-shadow:none}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;color:var(--muted);padding:3px 6px}
.btn.ghost:hover{background:#f1f5f9;color:var(--ink)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.search:focus,select:focus,input:focus,textarea:focus{outline:2px solid #99f6e4;outline-offset:0;border-color:var(--accent)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat{padding:13px 15px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;line-height:1.25;margin-top:2px}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--danger)} .stat.ok .v{color:var(--ok)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.panel h3{margin:0;padding:11px 15px;font-size:13.5px;border-bottom:1px solid var(--line);background:#fafbfc;font-weight:600}
.panel h3 em{font-style:normal;color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.panel .body{padding:12px 15px}

.tablewrap{overflow:auto;max-height:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#fafbfc;font-weight:600;color:#475569;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{background:#fafbfc;font-weight:600;border-top:2px solid var(--line)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);background:#f8fafc;white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#bbf7d0;background:#f0fdf4}
.tag.warn{color:var(--warn);border-color:#fde68a;background:#fffbeb}
.tag.bad{color:var(--danger);border-color:#fecaca;background:#fef2f2}
.tag.info{color:var(--accent-d);border-color:#99f6e4;background:#f0fdfa}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.wrap-cell{max-width:280px;white-space:pre-wrap;word-break:break-word}

/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.hidden{display:none}
.dialog{background:#fff;border-radius:12px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(2,6,23,.3)}
.dhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;font-size:15px}
.dhead .x{margin-left:auto;background:none;border:0;font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
.dhead .x:hover{background:#f1f5f9}
.dbody{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;overflow:auto}
.dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dfoot .hint{margin-right:auto;font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;color:#334155;font-weight:600}
.field>span b{color:var(--danger);font-weight:400}
.field em{font-style:normal;font-size:11px;color:var(--muted)}
.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.field textarea{resize:vertical}
.field.wide{grid-column:1 / -1}
.dfoot .total{font-weight:700;color:var(--accent-d)}

/* ---------- 提示条 ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#b91c1c}

.items{display:flex;flex-direction:column;gap:6px}
.items .row{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.items .row b{font-weight:600}
.items .row .r{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.hintbox{font-size:12.5px;color:var(--muted);line-height:1.7}
.hintbox code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ---------- 打印 ---------- */
#printArea{display:none}
@media print{
  body{background:#fff}
  .app,#toast,.overlay{display:none!important}
  #printArea{display:block!important}
  .cage-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
  .cage{border:1px dashed #333;padding:6mm 5mm;break-inside:avoid}
  .cage .t{font-size:15pt;font-weight:700}
  .cage .g{font-size:10pt;margin-top:3mm;line-height:1.6}
  .cage .p{font-size:9.5pt;margin-top:3mm;border-top:1px dotted #999;padding-top:2mm}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow:auto}
  .side-foot{display:none}
  nav{flex-direction:row;flex-wrap:wrap}
  .dbody{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">🐭 实验室管理台<small>小鼠 · 试剂 · 耗材</small></div>
    <nav id="nav">
      <button data-view="dash" class="active">📊 概览</button>
      <button data-view="mice">🐭 小鼠统计</button>
      <button data-view="reagents">🧪 试剂</button>
      <button data-view="consumables">🧴 耗材</button>
      <button data-view="logs">📥 出入库流水</button>
      <button data-view="data">💾 数据备份</button>
    </nav>
    <div class="side-foot" id="saveInfo">未保存</div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="viewTitle">概览</h1>
      <div class="topActions" id="topActions"></div>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="modal" class="overlay hidden">
  <div class="dialog">
    <div class="dhead"><h3 id="mTitle">编辑</h3><button class="x" type="button" onclick="closeModal()">✕</button></div>
    <form id="mForm">
      <div class="dbody" id="mBody"></div>
      <div class="dfoot">
        <span class="hint" id="mHint"></span>
        <button type="button" class="btn" onclick="closeModal()">取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="printArea"></div>
<div id="toast"></div>

<script>
"use strict";
/* ================= 基础工具 ================= */
const KEY = "labmgmt.v1";
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(String(v ?? "").replace(/,/g, "")); return isNaN(n) ? 0 : n; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = n => (Math.round(n * 10) / 10).toString();
const nf2 = n => (Math.round(n * 100) / 100).toString();
const todayStr = () => new Date().toLocaleDateString("sv-SE");
const dayDiff = d => Math.round((new Date(d + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000);
const cut = (s, n = 60) => (s && s.length > n ? s.slice(0, n) + "…" : (s || ""));

function blankState() {
  return { mice: [], reagents: [], consumables: [], logs: [], settings: { expWarn: 30 }, meta: { v: 1, updated: null } };
}
let state = loadState();

function loadState() {
  const b = blankState();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return b;
    const o = JSON.parse(raw) || {};
    return {
      mice: Array.isArray(o.mice) ? o.mice : [],
      reagents: Array.isArray(o.reagents) ? o.reagents : [],
      consumables: Array.isArray(o.consumables) ? o.consumables : [],
      logs: Array.isArray(o.logs) ? o.logs : [],
      settings: Object.assign(b.settings, o.settings || {}),
      meta: Object.assign(b.meta, o.meta || {})
    };
  } catch (e) { console.warn("读取本地数据失败", e); return b; }
}
function save() {
  state.meta.updated = Date.now();
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    toast("保存失败：浏览器存储空间不足，请先到「数据备份」导出 JSON", true);
  }
  paintSaveInfo();
}
function paintSaveInfo() {
  const t = state.meta.updated ? new Date(state.meta.updated) : null;
  const pad = n => String(n).padStart(2, "0");
  $("#saveInfo").textContent = t
    ? `已自动保存\n${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}`
    : "尚无数据";
  $("#saveInfo").style.whiteSpace = "pre-line";
}
let toastTimer;
function toast(msg, isErr) {
  const el = $("#toast");
  el.textContent = msg;
  el.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = ""), isErr ? 4500 : 2200);
}

/* ================= 字段定义 ================= */
const SCHEMA = {
  mice: [
    { k: "strain", l: "品系", t: "text", req: 1, ph: "如 C57BL/6J、BALB/c、NOD-SCID", list: 1 },
    { k: "sex", l: "性别", t: "select", opts: ["雄", "雌", "混合"] },
    { k: "cages", l: "笼子数量", t: "number", req: 1, step: "1", min: 0, ph: "笼数" },
    { k: "perCage", l: "只数 / 笼", t: "number", req: 1, step: "1", min: 0, ph: "每笼只数" },
    { k: "dob", l: "出生日期", t: "date", hint: "填了就自动算周龄，最准" },
    { k: "ageWeeks", l: "周龄（无出生日期时手填）", t: "number", step: "0.5", min: 0, ph: "如 8", hint: "按「周龄截至」日期换算到今天" },
    { k: "ageDate", l: "周龄截至日期", t: "date" },
    { k: "purpose", l: "实验目的", t: "textarea", req: 1, wide: 1, list: 1, ph: "如 荷瘤观察 28 天 / 药物处理 / 繁育保种 / 对照" },
    { k: "project", l: "项目 / 课题", t: "text", list: 1 },
    { k: "earTag", l: "耳号 / 笼号", t: "text", ph: "如 1-3 号笼" },
    { k: "room", l: "房间 / 架位", t: "text", list: 1, ph: "如 SPF-2 房 A3 架" },
    { k: "keeper", l: "负责人", t: "text", list: 1 },
    { k: "status", l: "状态", t: "select", opts: ["在养", "已结束"], def: "在养" },
    { k: "note", l: "备注", t: "textarea", wide: 1 }
  ],
  reagents: [
    { k: "name", l: "试剂名称", t: "text", req: 1, list: 1, ph: "如 Anti-CD3 antibody" },
    { k: "catNo", l: "货号", t: "text" },
    { k: "brand", l: "品牌", t: "text", list: 1, ph: "如 CST / Thermo" },
    { k: "spec", l: "规格", t: "text", ph: "如 100 µL / 500 mL" },
    { k: "category", l: "类别", t: "text", list: 1, ph: "抗体 / 试剂盒 / 化学试剂 / 培养基 / 细胞因子" },
    { k: "qty", l: "库存数量", t: "number", step: "any", min: 0, def: 0 },
    { k: "unit", l: "单位", t: "text", list: 1, ph: "µL / mL / 支 / 瓶 / 盒 / 次" },
    { k: "min", l: "库存下限", t: "number", step: "any", min: 0, def: 0, hint: "低于或等于此值时提醒补货" },
    { k: "location", l: "存放位置", t: "text", list: 1, ph: "如 4℃冰箱 A-2 / -20℃ B-1" },
    { k: "openDate", l: "开封日期", t: "date" },
    { k: "expiry", l: "有效期至", t: "date" },
    { k: "supplier", l: "供应商", t: "text", list: 1 },
    { k: "note", l: "备注", t: "textarea", wide: 1 }
  ],
  consumables: [
    { k: "name", l: "耗材名称", t: "text", req: 1, list: 1, ph: "如 10 µL 吸头 / 6 孔板 / 离心管" },
    { k: "spec", l: "规格", t: "text", ph: "如 96 支/盒 / 50 mL" },
    { k: "qty", l: "库存数量", t: "number", step: "any", min: 0, def: 0 },
    { k: "unit", l: "单位", t: "text", list: 1, ph: "盒 / 包 / 个 / 箱" },
    { k: "min", l: "安全库存", t: "number", step: "any", min: 0, def: 0, hint: "低于或等于此值时提醒补货" },
    { k: "location", l: "存放位置", t: "text", list: 1 },
    { k: "supplier", l: "供应商", t: "text", list: 1 },
    { k: "note", l: "备注", t: "textarea", wide: 1 }
  ]
};

/* ================= 计算 ================= */
function ageOf(r) {
  if (r.dob) {
    const d = (Date.now() - new Date(r.dob + "T00:00:00").getTime()) / 86400000;
    return { w: d / 7, from: "dob" };
  }
  if (r.ageWeeks !== null && r.ageWeeks !== undefined && r.ageWeeks !== "") {
    let w = num(r.ageWeeks);
    const ref = r.ageDate || (r.createdAt ? r.createdAt.slice(0, 10) : todayStr());
    w += dayDiff(ref) / -7; // 从记录日推算到今天
    return { w: w, from: "manual", ref };
  }
  return { w: null, from: "none" };
}
const totalMice = r => num(r.cages) * num(r.perCage);
const isActive = r => (r.status || "在养") !== "已结束";
const expDays = r => (r.expiry ? dayDiff(r.expiry) : null);

/* ================= 过滤 ================= */
const ui = { view: "dash", q: { mice: "", reagents: "", consumables: "", logs: "" }, status: "all", strain: "all", cat: "all", logKind: "all" };

function filterMice() {
  const q = ui.q.mice.trim().toLowerCase();
  return state.mice.filter(r => {
    if (ui.status === "active" && !isActive(r)) return false;
    if (ui.status === "done" && isActive(r)) return false;
    if (ui.strain !== "all" && (r.strain || "") !== ui.strain) return false;
    if (!q) return true;
    return [r.strain, r.purpose, r.project, r.earTag, r.room, r.keeper, r.note, r.sex].join(" ").toLowerCase().includes(q);
  });
}
function filterStock(kind) {
  const q = ui.q[kind].trim().toLowerCase();
  return state[kind].filter(r => {
    if (kind === "reagents" && ui.cat !== "all" && (r.category || "") !== ui.cat) return false;
    if (!q) return true;
    return [r.name, r.catNo, r.brand, r.spec, r.category, r.location, r.supplier, r.note].join(" ").toLowerCase().includes(q);
  });
}
function filterLogs() {
  const q = ui.q.logs.trim().toLowerCase();
  return state.logs
    .filter(l => (ui.logKind === "all" || l.kind === ui.logKind))
    .filter(l => !q || [l.itemName, l.action, l.operator, l.note].join(" ").toLowerCase().includes(q))
    .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.ts || 0) - (a.ts || 0));
}

/* ================= 提醒 ================= */
function alerts() {
  const out = [];
  const warn = num(state.settings.expWarn) || 30;
  state.reagents.filter(r => r.expiry).forEach(r => {
    const d = expDays(r);
    if (d < 0) out.push({ cls: "bad", txt: `已过期 ${-d} 天`, name: r.name, extra: `${r.expiry} · ${r.location || ""}` });
    else if (d <= warn) out.push({ cls: "warn", txt: `${d} 天后过期`, name: r.name, extra: `${r.expiry} · ${r.location || ""}` });
  });
  state.reagents.filter(r => num(r.min) > 0 && num(r.qty) <= num(r.min)).forEach(r => {
    out.push({ cls: "warn", txt: "试剂库存不足", name: r.name, extra: `剩 ${nf2(num(r.qty))} ${r.unit || ""} / 下限 ${nf2(num(r.min))}` });
  });
  state.consumables.filter(r => num(r.min) > 0 && num(r.qty) <= num(r.min)).forEach(r => {
    out.push({ cls: "warn", txt: "耗材库存不足", name: r.name, extra: `剩 ${nf2(num(r.qty))} ${r.unit || ""} / 下限 ${nf2(num(r.min))}` });
  });
  return out;
}

/* ================= 视图：概览 ================= */
function viewDash() {
  const act = state.mice.filter(isActive);
  const cages = act.reduce((s, r) => s + num(r.cages), 0);
  const mice = act.reduce((s, r) => s + totalMice(r), 0);
  const strains = new Set(act.map(r => r.strain).filter(Boolean));
  const al = alerts();
  const bad = al.filter(a => a.cls === "bad").length;

  const byStrain = {};
  act.forEach(r => {
    const k = r.strain || "(未填品系)";
    const o = byStrain[k] || (byStrain[k] = { cages: 0, mice: 0, n: 0, wk: [], purposes: new Set(), projects: new Set() });
    o.cages += num(r.cages); o.mice += totalMice(r); o.n++;
    const a = ageOf(r); if (a.w !== null) o.wk.push(a.w);
    if (r.purpose) o.purposes.add(r.purpose.trim());
    if (r.project) o.projects.add(r.project.trim());
  });
  const strainRows = Object.entries(byStrain).sort((a, b) => b[1].mice - a[1].mice).map(([k, o]) => {
    const w0 = o.wk.length ? Math.min(...o.wk) : null, w1 = o.wk.length ? Math.max(...o.wk) : null;

  const lowRe = state.reagents.filter(r => num(r.min) > 0 && num(r.qty) <= num(r.min)).length;

      <div class="stat card"><div class="k">耗材品种</div><div class="v">${state.consumables.length}</div><div class="s">${lowCo ? lowCo + " 项库存不足" : "库存正常"}</div></div>

    </div>

    <div class="panel">

          <tbody>${strainRows || '<tr><td colspan="7" class="empty">还没有在养的小鼠记录，去「小鼠统计」新增一条吧</td></tr>'}</tbody>
          <tfoot><tr><td>合计</td><td class="num">${act.length}</td><td class="num">${nf(cages)}</td><td class="num">${nf(mice)}</td><td colspan="3"></td></tr></tfoot>
        </table>
      </div>
    </div>

    <div class="panel">
      <h3>提醒 <em>有效期阈值 ${num(state.settings.expWarn) || 30} 天，可在「数据备份」里调整</em></h3>
      <div class="body">
        ${al.length ? `<div class="items">${al.map(a => `<div class="row"><span class="tag ${a.cls}">${esc(a.txt)}</span><b>${esc(a.name)}</b><span class="r">${esc(a.extra)}</span></div>`).join("")}</div>`

    <div class="panel">
      <h3>最近出入库 <em>最新 8 条</em></h3>

}

function viewMice() {
  const strains = [...new Set(state.mice.map(r => r.strain).filter(Boolean))].sort();
  $("#content").innerHTML = `
    <div class="toolbar">
      <input id="q-mice" class="search" placeholder="搜索 品系 / 实验目的 / 项目 / 耳号 / 房间 / 负责人" value="${esc(ui.q.mice)}">
      <select id="f-status">
        <option value="all"${ui.status === "all" ? " selected" : ""}>全部状态</option>
        <option value="active"${ui.status === "active" ? " selected" : ""}>仅在养</option>
        <option value="done"${ui.status === "done" ? " selected" : ""}>仅已结束</option>
      </select>
      <select id="f-strain"><option value="all">全部品系</option>${strains.map(s => `<option value="${esc(s)}"${ui.strain === s ? " selected" : ""}>${esc(s)}</option>`).join("")}</select>

    </div>
    <div class="cards" id="miceStats"></div>
    <div class="panel">

      <div class="tablewrap" id="miceRows"></div>
    </div>`;
  $("#q-mice").oninput = e => { ui.q.mice = e.target.value; rowsMice(); };
  $("#f-status").onchange = e => { ui.status = e.target.value; rowsMice(); statsMice(); };
  $("#f-strain").onchange = e => { ui.strain = e.target.value; rowsMice(); statsMice(); };
  $("#content .toolbar").onclick = e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    if (b.dataset.act === "new") openForm("mice");
    if (b.dataset.act === "print") printCages();
    if (b.dataset.act === "csv") exportCSV("mice");
  };
  $("#miceRows").onclick = e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.act === "edit") openForm("mice", id);
    if (b.dataset.act === "del") delRecord("mice", id);
    if (b.dataset.act === "toggle") {
      const r = state.mice.find(x => x.id === id); if (!r) return;
      r.status = isActive(r) ? "已结束" : "在养"; r.updatedAt = new Date().toISOString();
      save(); rowsMice(); statsMice();
      toast("已标记为「" + r.status + "」");
    }
  };
  rowsMice(); statsMice();
}

function statsMice() {
  const list = filterMice(), act = list.filter(isActive);
  const cages = act.reduce((s, r) => s + num(r.cages), 0);
  const mice = act.reduce((s, r) => s + totalMice(r), 0);
  const perCage = cages ? (mice / cages) : 0;
  const strains = new Set(act.map(r => r.strain).filter(Boolean));
  $("#miceStats").innerHTML = `
    <div class="stat card"><div class="k">在养总只数</div><div class="v">${nf(mice)}</div><div class="s">筛选结果内</div></div>
    <div class="stat card"><div class="k">笼数合计</div><div class="v">${nf(cages)}</div><div class="s">平均 ${perCage ? nf(perCage) : "—"} 只/笼</div></div>
    <div class="stat card"><div class="k">品系数</div><div class="v">${strains.size}</div><div class="s">${esc(cut([...strains].join("、"), 34)) || "—"}</div></div>
    <div class="stat card"><div class="k">记录条数</div><div class="v">${list.length}</div><div class="s">在养 ${act.length} / 已结束 ${list.length - act.length}</div></div>`;
}

function rowsMice() {
  const list = filterMice();
  if (!list.length) {
    $("#miceRows").innerHTML = '<div class="empty">没有符合条件的记录。点「+ 新增记录」开始。</div>';
    return;
  }
  const rows = list.map(r => {
    const a = ageOf(r);
    const ageTxt = a.w === null ? '<span class="tag warn">未填</span>'
      : `${nf(a.w)} 周<div class="muted" style="font-size:11px">${a.from === "dob" ? "按出生日期" : "按记录日推算"}</div>`;
    const st = isActive(r) ? '<span class="tag ok">在养</span>' : '<span class="tag">已结束</span>';
    return `<tr>
      <td><b>${esc(r.strain || "")}</b><div class="muted" style="font-size:11.5px">${esc([r.sex, r.earTag].filter(Boolean).join(" · "))}</div></td>
      <td class="nowrap">${ageTxt}</td>
      <td class="num">${nf(num(r.cages))}</td>
      <td class="num">${nf(num(r.perCage))}</td>
      <td class="num"><b>${nf(totalMice(r))}</b></td>
      <td class="wrap-cell">${esc(r.purpose || "")}</td>
      <td class="wrap-cell">${esc([r.project, r.room].filter(Boolean).join(" · ")) || '<span class="muted">—</span>'}</td>
      <td>${st}</td>
      <td class="nowrap">
        <button class="btn mini" data-act="edit" data-id="${r.id}">编辑</button>
        <button class="btn mini" data-act="toggle" data-id="${r.id}">${isActive(r) ? "结束" : "恢复"}</button>
        <button class="btn mini danger" data-act="del" data-id="${r.id}">删</button>
      </td></tr>`;
  }).join("");
  const act = list.filter(isActive);
  const tc = act.reduce((s, r) => s + num(r.cages), 0), tm = act.reduce((s, r) => s + totalMice(r), 0);
  $("#miceRows").innerHTML = `<table>
    <thead><tr><th>品系 / 性别</th><th>周龄</th><th class="num">笼数</th><th class="num">只数/笼</th><th class="num">总只数</th><th>实验目的</th><th>项目 · 位置</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="2">显示 ${list.length} 条（在养 ${act.length} 条）</td><td class="num">${nf(tc)}</td><td class="num"></td><td class="num">${nf(tm)}</td><td colspan="4"></td></tr></tfoot>
  </table>`;
}

function viewStock(kind) {
  const isRe = kind === "reagents";
  const cats = isRe ? [...new Set(state.reagents.map(r => r.category).filter(Boolean))].sort() : [];
  $("#content").innerHTML = `
    <div class="toolbar">
      <input id="q-stock" class="search" placeholder="搜索 名称 / 货号 / 品牌 / 位置 / 供应商" value="${esc(ui.q[kind])}">
      ${isRe ? `<select id="f-cat"><option value="all">全部类别</option>${cats.map(c => `<option value="${esc(c)}"${ui.cat === c ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>` : ""}

  $("#content .toolbar").onclick = e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    if (b.dataset.act === "new") openForm(kind);
    if (b.dataset.act === "csv") exportCSV(kind);
  };
  $("#stockRows").onclick = e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = b.dataset.id, r = state[kind].find(x => x.id === id);
    if (b.dataset.act === "edit") openForm(kind, id);
    if (b.dataset.act === "del") delRecord(kind, id);

function statsStock(kind) {
  const list = filterStock(kind);
  const cats = new Set(list.map(r => r.category).filter(Boolean));
  const low = list.filter(r => num(r.min) > 0 && num(r.qty) <= num(r.min)).length;
  const exp = kind === "reagents" ? list.filter(r => r.expiry && expDays(r) <= (num(state.settings.expWarn) || 30)).length : 0;
  $("#stockStats").innerHTML = `
    <div class="stat card"><div class="k">品种数</div><div class="v">${list.length}</div><div class="s">${kind === "reagents" ? cats.size + " 个类别" : "耗材"}</div></div>
    <div class="stat card ${low ? "warn" : "ok"}"><div class="k">库存不足</div><div class="v">${low}</div><div class="s">低于或等于下限</div></div>
    ${kind === "reagents"
      ? `<div class="stat card ${exp ? "warn" : "ok"}"><div class="k">临期 / 过期</div><div class="v">${exp}</div><div class="s">阈值 ${num(state.settings.expWarn) || 30} 天</div></div>`
      : `<div class="stat card"><div class="k">单位种类</div><div class="v">${new Set(list.map(r => r.unit).filter(Boolean)).size}</div><div class="s">按单位分别统计</div></div>`}`;
}

function rowsStock(kind) {
  const isRe = kind === "reagents", list = filterStock(kind);
  if (!list.length) { $("#stockRows").innerHTML = `<div class="empty">还没有${isRe ? "试剂" : "耗材"}记录。</div>`; return; }
  const rows = list.map(r => {
    const q = num(r.qty), m = num(r.min);
    const lowCls = m > 0 && q <= m ? "bad" : "";
    let expCell = "";
    if (isRe) {
      const d = expDays(r);
      expCell = d === null ? '<span class="muted">—</span>'
        : d < 0 ? `<span class="tag bad">过期 ${-d} 天</span>`
        : d <= (num(state.settings.expWarn) || 30) ? `<span class="tag warn">${d} 天后</span>`
        : `<span class="nowrap">${esc(r.expiry)}</span>`;
    }
    return `<tr>
      <td><b>${esc(r.name)}</b><div class="muted" style="font-size:11.5px">${esc([r.brand, r.catNo, r.spec].filter(Boolean).join(" · "))}</div></td>
      ${isRe ? `<td>${esc(r.category || "") || '<span class="muted">—</span>'}</td>` : ""}
      <td class="num"><span class="tag ${lowCls || "info"}">${nf2(q)} ${esc(r.unit || "")}</span>${m ? `<div class="muted" style="font-size:11px">下限 ${nf2(m)}</div>` : ""}</td>
      <td>${esc(r.location || "") || '<span class="muted">—</span>'}</td>
      ${isRe ? `<td class="nowrap">${expCell}</td>` : ""}
      <td>${esc(r.supplier || "") || '<span class="muted">—</span>'}</td>
      <td class="nowrap">
        <button class="btn mini" data-act="stock" data-id="${r.id}">出入库</button>
        <button class="btn mini" data-act="edit" data-id="${r.id}">编辑</button>
        <button class="btn mini danger" data-act="del" data-id="${r.id}">删</button>
      </td></tr>`;
  }).join("");
  const cols = isRe ? 6 : 4;
  $("#stockRows").innerHTML = `<table>
    <thead><tr><th>名称 / 规格</th>${isRe ? "<th>类别</th>" : ""}<th class="num">库存</th><th>存放位置</th>${isRe ? "<th>有效期</th>" : ""}<th>供应商</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="${cols}">显示 ${list.length} 条</td><td></td></tr></tfoot>
  </table>`;
}

          <div>周龄一律按“今天”实时换算；只要填了出生日期，周龄会自动增长。</div>
        </div>
      </div>

      <div class="panel">
        <h3>其他</h3>
        <div class="body hintbox">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
            <button class="btn" data-act="demo">载入示例数据</button>
            <button class="btn danger" data-act="clear">清空全部数据</button>
          </div>
          <div>• 多人同时用：不要把这个文件放在共享盘各自打开，会产生多份互不同步的数据。需要多人共用请告诉我，我改成局域网小服务器版本（SQLite 存一份，大家浏览器访问）。
          <br>• 手机/平板：文件拷过去用浏览器打开也能用，但两端数据不互通。</div>
        </div>
      </div>
    </div>`;

  $("#content").onclick = e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const act = b.dataset.act;
    if (act === "bk") backupJSON();
    if (act === "rs") $("#fileImport").click();
    if (act.startsWith("e-")) exportCSV(act.slice(2));
    if (act === "saveWarn") {
      state.settings.expWarn = Math.max(1, num($("#expWarn").value) || 30);
      save(); toast("已保存提醒天数");
    }
    if (act === "demo") loadDemo();
    if (act === "clear") clearAll();
  };
  $("#fileImport").onchange = e => importJSON(e.target.files[0]);
}

/* ================= 表单弹窗 ================= */
let editing = { kind: null, id: null };

function fieldHTML(kind, f, val) {
  const id = "f_" + f.k;
  let input;
  const listAttr = f.list ? ` list="dl_${kind}_${f.k}"` : "";
  switch (f.t) {
    case "textarea":
      input = `<textarea id="${id}" name="${f.k}" rows="2" placeholder="${esc(f.ph || "")}">${esc(val ?? "")}</textarea>`;
      break;
    case "select":
      input = `<select id="${id}" name="${f.k}">${(f.opts || []).map(o => `<option${o === (val ?? f.def ?? f.opts[0]) ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
      break;
    case "date":
      input = `<input id="${id}" name="${f.k}" type="date" value="${esc(val || "")}">`;
      break;
    case "number":
      input = `<input id="${id}" name="${f.k}" type="number" step="${f.step || "any"}" min="${f.min ?? 0}" value="${val === null || val === undefined || val === "" ? "" : esc(val)}" placeholder="${esc(f.ph || "")}">`;
      break;
    default:
      input = `<input id="${id}" name="${f.k}" type="text" value="${esc(val ?? "")}" placeholder="${esc(f.ph || "")}"${listAttr}>`;
  }
  return `<label class="field${f.wide ? " wide" : ""}"><span>${esc(f.l)}${f.req ? " <b>*</b>" : ""}</span>${input}${f.hint ? `<em>${esc(f.hint)}</em>` : ""}</label>`;
}

function openForm(kind, id) {
  const fields = SCHEMA[kind];
  const rec = id ? state[kind].find(x => x.id === id) : null;
  editing = { kind, id: id || null };
  const isNew = !rec;
  const title = { mice: "小鼠记录", reagents: "试剂", consumables: "耗材" }[kind];

  // 自动补全数据源
  const dl = fields.filter(f => f.list).map(f => {
    const vals = [...new Set(state[kind].map(r => r[f.k]).filter(v => v !== "" && v !== null && v !== undefined))];
    return `<datalist id="dl_${kind}_${f.k}">${vals.map(v => `<option value="${esc(v)}">`).join("")}</datalist>`;
  }).join("");

  $("#mTitle").textContent = (isNew ? "新增" : "编辑") + title;
  $("#mBody").innerHTML = dl + fields.map(f => fieldHTML(kind, f, rec ? rec[f.k] : (f.def ?? ""))).join("");
  $("#mHint").innerHTML = "";
  $("#modal").classList.remove("hidden");
  const first = $("#mBody input, #mBody select, #mBody textarea");
  if (first) setTimeout(() => first.focus(), 30);

  if (kind === "mice") hookMouseForm();
  $("#mForm").onsubmit = onSubmitForm;
}

function hookMouseForm() {
  const c = $("#f_cages"), p = $("#f_perCage"), dob = $("#f_dob"), aw = $("#f_ageWeeks"), ad = $("#f_ageDate");
  const hint = $("#mHint");
  const upd = () => {
    const t = num(c.value) * num(p.value);
    let s = `合计 <span class="total">${nf(t)}</span> 只`;
    if (dob.value) {
      const w = (Date.now() - new Date(dob.value + "T00:00:00").getTime()) / 86400000 / 7;
      s += ` · 按出生日期推算 <b>${nf(w)} 周</b>`;
    } else if (aw.value) {
      s += ` · 手填周龄 ${nf(num(aw.value))} 周`;
    }
    hint.innerHTML = s;
  };
  [c, p, dob, aw].forEach(el => el && el.addEventListener("input", upd));
  upd();
}

function readForm(kind) {
  const out = {};
  SCHEMA[kind].forEach(f => {
    const el = document.getElementById("f_" + f.k);
    if (!el) return;
    let v = el.value;
    if (f.t === "number") out[f.k] = v === "" ? null : num(v);
    else out[f.k] = v.trim();
  });
  return out;
}

function onSubmitForm(ev) {
  ev.preventDefault();
  const { kind, id } = editing;
  const data = readForm(kind);
  const missing = SCHEMA[kind].filter(f => f.req && (data[f.k] === "" || data[f.k] === null)).map(f => f.l);
  if (missing.length) { toast("请填写：" + missing.join("、"), true); return; }

  if (id) {
    const rec = state[kind].find(x => x.id === id);
    Object.assign(rec, data, { updatedAt: new Date().toISOString() });
  } else {
    state[kind].unshift(Object.assign({ id: uid(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }, data));
    if (kind === "mice" && !data.status) state[kind][0].status = "在养";
  }
  save();
  closeModal();
  render();
  toast(id ? "已保存修改" : "已新增");
}

function closeModal() {
  $("#modal").classList.add("hidden");
  $("#mForm").onsubmit = null;
  editing = { kind: null, id: null };
}

function delRecord(kind, id) {
  const rec = state[kind].find(x => x.id === id); if (!rec) return;
  const name = kind === "mice" ? `${rec.strain}（${rec.purpose || ""}）` : rec.name;
  if (!confirm(`确定删除「${name}」？\n此操作不可撤销。`)) return;
  state[kind] = state[kind].filter(x => x.id !== id);
  save(); render(); toast("已删除");
}

/* ================= 出入库 ================= */
function openStock(kind, id) {
  const r = state[kind].find(x => x.id === id); if (!r) return;
  editing = { kind: "__stock", id };
  $("#mTitle").textContent = `${r.name} · 出入库`;
  $("#mBody").innerHTML = `
    <div class="field wide"><span>当前库存</span><div style="padding:6px 0;font-weight:700;font-size:16px">${nf2(num(r.qty))} ${esc(r.unit || "")}</div></div>
    <label class="field"><span>日期</span><input type="date" name="date" value="${todayStr()}"></label>
    <label class="field"><span>动作</span><select name="action"><option>入库</option><option>出库</option></select></label>
    <label class="field"><span>数量 <b>*</b></span><input type="number" name="qty" step="any" min="0" placeholder="如 1"></label>
    <label class="field"><span>操作人</span><input type="text" name="operator" placeholder="姓名"></label>
    <label class="field wide"><span>备注</span><textarea name="note" rows="2" placeholder="如 新到货 / 实验消耗 / 借出"></textarea></label>`;
  $("#mHint").innerHTML = "";
  $("#modal").classList.remove("hidden");
  setTimeout(() => { const q = $('[name="qty"]'); q && q.focus(); }, 30);
  $("#mForm").onsubmit = ev => {
    ev.preventDefault();
    const fd = new FormData($("#mForm"));
    const qty = num(fd.get("qty"));
    if (qty <= 0) { toast("数量必须大于 0", true); return; }
    const action = fd.get("action");
    if (action === "出库" && qty > num(r.qty)) { toast(`库存不足，当前只有 ${nf2(num(r.qty))} ${r.unit || ""}`, true); return; }
    r.qty = Math.round((num(r.qty) + (action === "入库" ? qty : -qty)) * 100) / 100;
    r.updatedAt = new Date().toISOString();
    state.logs.push({
      id: uid(), ts: Date.now(), date: String(fd.get("date")) || todayStr(),
      kind, itemId: r.id, itemName: r.name, unit: r.unit || "",
      action, qty, operator: String(fd.get("operator") || "").trim(), note: String(fd.get("note") || "").trim()
    });
    save(); closeModal(); render();
    toast(`${action}成功，当前 ${nf2(num(r.qty))} ${r.unit || ""}`);
  };
}

/* ================= 导入导出 ================= */
function download(text, filename, mime) {
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function backupJSON() {
  const stamp = todayStr().replace(/-/g, "");
  download(JSON.stringify(state, null, 2), `实验室管理备份-${stamp}.json`, "application/json");
  toast("备份已下载");
}
function csvCell(v) {
  const s = String(v ?? "");
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(headers, rows) {
  return "\ufeff" + [headers.map(csvCell).join(",")].concat(rows.map(r => r.map(csvCell).join(","))).join("\r\n");
}
function exportCSV(kind) {
  const stamp = todayStr().replace(/-/g, "");
  let csv = "", name = "";
  if (kind === "mice") {
    name = `小鼠记录-${stamp}.csv`;
    const rows = filterMice().map(r => {
      const a = ageOf(r);
      return [r.strain, r.sex, a.w === null ? "" : nf(a.w), r.dob || "", r.cages, r.perCage, totalMice(r),
        r.purpose, r.project, r.earTag, r.room, r.keeper, r.status || "在养", r.note];
    });
    csv = toCSV(["品系", "性别", "周龄", "出生日期", "笼数", "只数/笼", "总只数", "实验目的", "项目", "耳号/笼号", "房间/架位", "负责人", "状态", "备注"], rows);
  } else if (kind === "reagents") {
    name = `试剂库存-${stamp}.csv`;
    csv = toCSV(["名称", "货号", "品牌", "规格", "类别", "库存", "单位", "库存下限", "存放位置", "开封日期", "有效期至", "剩余天数", "供应商", "备注"],
      filterStock("reagents").map(r => [r.name, r.catNo, r.brand, r.spec, r.category, r.qty, r.unit, r.min, r.location, r.openDate,
        r.expiry, r.expiry ? dayDiff(r.expiry) : "", r.supplier, r.note]));
  } else if (kind === "consumables") {
    name = `耗材库存-${stamp}.csv`;
    csv = toCSV(["名称", "规格", "库存", "单位", "安全库存", "存放位置", "供应商", "备注"],
      filterStock("consumables").map(r => [r.name, r.spec, r.qty, r.unit, r.min, r.location, r.supplier, r.note]));
  } else if (kind === "logs") {
    name = `出入库流水-${stamp}.csv`;
    csv = toCSV(["日期", "类型", "物品", "动作", "数量", "单位", "操作人", "备注"],
      filterLogs().map(l => [l.date, l.kind === "reagents" ? "试剂" : "耗材", l.itemName, l.action, l.qty, l.unit, l.operator, l.note]));
  }
  download(csv, name, "text/csv;charset=utf-8");
  toast("已导出 " + name);
}

function importJSON(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const o = JSON.parse(fr.result);
      if (!o || typeof o !== "object" || (!Array.isArray(o.mice) && !Array.isArray(o.reagents) && !Array.isArray(o.consumables)))
        throw new Error("不是本工具的备份文件");
      const n = (o.mice || []).length + (o.reagents || []).length + (o.consumables || []).length;
      if (!confirm(`即将用备份覆盖当前数据（小鼠 ${(o.mice || []).length} 条 / 试剂 ${(o.reagents || []).length} 条 / 耗材 ${(o.consumables || []).length} 条）。\n当前数据会被替换，建议先导出一次备份。继续？`)) return;
      state = {
        mice: o.mice || [], reagents: o.reagents || [], consumables: o.consumables || [], logs: o.logs || [],
        settings: Object.assign(blankState().settings, o.settings || {}), meta: { v: 1, updated: Date.now() }
      };
      save(); render(); toast(`恢复成功，共 ${n} 条记录`);
    } catch (e) { toast("导入失败：" + e.message, true); }
    finally { const i = $("#fileImport"); if (i) i.value = ""; }
  };
  fr.readAsText(file, "utf-8");
}

function clearAll() {
  if (!confirm("确定清空全部数据？\n小鼠、试剂、耗材、流水都会删除。建议先导出 JSON 备份。")) return;
  if (!confirm("再确认一次：删了就找不回来了，真的清空？")) return;
  state = blankState(); save(); render(); toast("已清空");
}

/* ================= 路由 ================= */
const TITLES = {
  dash: ["概览", "小鼠总量 · 品系分布 · 库存预警"],
  mice: ["小鼠统计", "品系 / 周龄 / 笼数 / 只数·笼 / 实验目的"],
  reagents: ["试剂库存", "库存 · 位置 · 有效期"],
  consumables: ["耗材库存", "库存 · 安全库存"],
  logs: ["出入库流水", "所有试剂与耗材变动记录"],
  data: ["数据备份", "导出 · 恢复 · 设置"]
};
function setView(v) {
  ui.view = v;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  render();
}
function render() {
  const [t, s] = TITLES[ui.view] || TITLES.dash;
  $("#viewTitle").innerHTML = `${esc(t)}<span>${esc(s)}</span>`;
  $("#topActions").innerHTML = "";
  ({
    dash: viewDash, mice: viewMice, reagents: () => viewStock("reagents"),
    consumables: () => viewStock("consumables"), logs: viewLogs, data: viewData
  })[ui.view]();
  paintSaveInfo();
}

/* ================= 启动 ================= */
document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]"); if (!b) return;
  ui.cat = "all"; ui.logKind = "all";
  setView(b.dataset.view);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").classList.contains("hidden")) closeModal();
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !$("#modal").classList.contains("hidden")) {
    const f = $("#mForm"); if (f) f.requestSubmit();
  }
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

if (!state.meta.updated && !state.mice.length && !state.reagents.length && !state.consumables.length) {
  // 首次打开：直接展示示例，让用户知道怎么填
  setTimeout(() => { if (confirm("第一次打开，要不要先载入一份示例数据（可随时删除）？\n选“取消”则从空白开始。")) loadDemo(); }, 300);
}
render();
paintSaveInfo();
